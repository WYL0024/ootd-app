function canStoreImage(dataUrl){
  if(ImgStore.mode === 'idb') return true;
  return dataUrlBytes(state) + (dataUrl ? dataUrl.length : 0) <= CONFIG.LIMITS.localImageBudget;
}
function localName(colorName, category){
  return `${colorName}${categoryLabel(category)}`;
}
async function tagGarmentWithAI(imageUrl, signal){
  const content = await aiChat({
    messages: visionMessages(PROMPTS.tagSystem, PROMPTS.tagUser, imageUrl),
    model: aiConfig.visionModel || aiConfig.textModel,
    maxTokens: CONFIG.AI.tagMaxTokens,
    temperature: CONFIG.AI.temperature,
    timeoutMs: CONFIG.AI.visionTimeoutMs,
    signal
  });
  return normalizeAITagResult(parseJSONFromModel(content));
}
function applyAITag(garment, tag){
  garment.category = tag.category;
  garment.colorName = tag.colorName;
  garment.colorHex = getColor(tag.colorName).hex;
  garment.secondaryColor = tag.secondaryColor || '';
  garment.styles = tag.styles;
  garment.seasons = tag.seasons;
  garment.formality = tag.formality;
  garment.material = tag.material;
  garment.description = tag.description;
  garment.tagSource = 'ai';
  if(tag.description) garment.name = String(tag.description).slice(0,16);
  else garment.name = localName(tag.colorName, tag.category);
}

async function handleWardrobeFiles(files){
  const batch = Array.from(files||[]).slice(0, CONFIG.LIMITS.maxBatch);
  if(!batch.length) return;
  if(ui.job){ toast('还有 AI 任务在进行，请先等待或取消'); return; }
  const job = beginJob('处理照片中','准备压缩…');
  let imported = 0;
  let aiFailed = 0;
  let lastAIError = '';
  for(let i=0;i<batch.length;i++){
    if(job.cancelled) break;
    updateJob('处理照片中', `第 ${i+1}/${batch.length} 件 · 本地压缩`);
    let processed;
    try{
      processed = await processImageFile(batch[i]);
    }catch(err){
      toast('跳过 1 张：'+(err&&err.message?err.message:'图片读取失败'));
      continue;
    }
    if(!canStoreImage(processed.storeUrl)){
      toast('本地存储接近上限（约 3.5MB），先删几件再上传');
      break;
    }
    const garment = {
      id: uid(),
      name: localName(processed.colorName, 'top'),
      category:'top',
      colorName: processed.colorName,
      colorHex: getColor(processed.colorName).hex,
      secondaryColor:'',
      styles: [ui.outfitStyle || 'cleanfit'],
      seasons: [seasonForDate()],
      formality: 3,
      material:'待补充',
      description:'',
      image: processed.storeUrl,
      __origSrc: ImgStore.mode==='local' ? '' : processed.storeUrl,
      source:'photo',
      tagSource:'local',
      autoName:true,
      aiPending:false,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    if(isAIConfigured() && !job.cancelled){
      updateJob('AI 识别中', `第 ${i+1}/${batch.length} 件 · 识别品类与配色`);
      try{
        const tag = await tagGarmentWithAI(processed.aiUrl, job.controller.signal);
        applyAITag(garment, tag);
      }catch(err){
        aiFailed++;
        lastAIError = friendlyAIError(err);
        garment.tagSource = 'local';
        garment.name = localName(garment.colorName, garment.category);
        if(err && err.kind==='cancelled'){
          garment.aiPending = false;
          state.garments.unshift(garment);
          persistOrWarn();
          imported++;
          break;
        }
      }
    }
    garment.aiPending = false;
    state.garments.unshift(garment);
    persistOrWarn();
    imported++;
  }
  endJob(job);
  if(imported) render();
  if(imported){
    let msg = `已导入 ${imported} 件单品`;
    if(aiFailed) msg += `，${aiFailed} 件回退本地识别`;
    toast(msg);
  }else if(!job.cancelled){
    toast('没有导入新单品');
  }else{
    toast('已取消，已处理的单品保留在衣柜');
  }
  if(aiFailed && lastAIError && !job.cancelled){

function buildEngineCtx(seed){
  return {
    styleId: ui.outfitStyle,
    season: ui.outfitSeason,
    refs: state.refs,
    prefs: state.prefs,
    favorites: state.favorites,
    feedback: state.feedback,
    seed: seed || Date.now()
  };
}
function generateOutfits(){
  if(ui.generating) return;
  ui.generating = true;
  ui.genMessage = '';
  ui.genError = '';
  ui.outfits = [];
  ui.pool = [];
  render();
  setTimeout(()=>{
    try{
      const result = StylingEngine.generate(state.garments, buildEngineCtx(Date.now()));
      if(result.error){
        ui.genMessage = result.message;
        ui.genError = result.error;
      }else{
        ui.outfits = result.candidates.slice(0,6);
        ui.pool = result.candidates;
        ui.generatedAt = Date.now();
      }
    }catch(err){
      ui.genMessage = '生成时出了点问题：'+(err&&err.message?err.message:'未知错误')+ '，可重试或补几件单品。';
      ui.genError = 'exception';
    }
    ui.generating = false;
    render();
    if(ui.outfits.length && isAIConfigured() && !ui.job){
      polishVisibleLooks(3);
    }
  }, 60);
}
function findLook(key){
  return ui.outfits.find(l=>l.key===key) || null;
}
function pickOutfitStyle(styleId){
  if(ui.outfitStyle===styleId) return;
  ui.outfitStyle = styleId;
  if(ui.outfits.length){ generateOutfits(); }
  else{ render(); }
}
function pickSeason(season){
  if(!SEASONS.includes(season)) return;
  ui.outfitSeason = season;
  if(ui.outfits.length) generateOutfits();
  else render();
}
function shuffleLook(key){
  const idx = ui.outfits.findIndex(l=>l.key===key);
  if(idx<0) return;
  const visibleKeys = ui.outfits.map(l=>l.key);
  const disliked = state.feedback.dislikedKeys || [];
  const candidates = ui.pool.filter(l=>!visibleKeys.includes(l.key) && !disliked.includes(l.key));
  if(!candidates.length){
    toast('候选已经用完，换个风格或补几件单品再试');
    return;
  }
  ui.outfits.splice(idx, 1, candidates[0]);
  render();
  toast('已换一套新的组合');
}
function dislikeLook(key){
  const idx = ui.outfits.findIndex(l=>l.key===key);
  if(idx<0) return;
  const look = ui.outfits[idx];
  if(!state.feedback.dislikedKeys.includes(key)) state.feedback.dislikedKeys.push(key);
  look.items.forEach(it=>{
    state.feedback.dislikedItems[it.id] = (Number(state.feedback.dislikedItems[it.id])||0)+1;
  });
  const oldKeys = ui.outfits.map(l=>l.key);
  ui.outfits.splice(idx,1);
  const disliked = state.feedback.dislikedKeys;
  const next = ui.pool.find(l=>!oldKeys.includes(l.key) && !disliked.includes(l.key));
  if(next) ui.outfits.splice(idx, 0, next);
  persistOrWarn();
  render();
  toast('已记录不喜欢，后续会少出类似组合');
}
function favoriteLook(key){
  const look = findLook(key);
  if(!look) return;
  const existing = state.favorites.findIndex(f=>f.key===key);
  if(existing>=0){
    state.favorites.splice(existing,1);
    state.feedback.likedKeys = (state.feedback.likedKeys||[]).filter(k=>k!==key);
    persistOrWarn();
    render();
    toast('已取消收藏');
    return;
  }
  const snapshot = {
    id: uid(),
    key: look.key,
    styleId: look.styleId,
    styleName: look.styleName,
    season: look.season,
    score: look.score,
    reason: look.reason,
    reasonSource: look.reasonSource,
    createdAt: Date.now(),
    items: look.items.map(it=>{
      const live = getGarment(it.id);
      const buyUrl = (live && live.buyUrl) || it.buyUrl || '';
      const p = buyUrl ? parseBuyUrl(buyUrl) : { ok:false };
      return {
        id: it.id, name: it.name, category: it.category,
        colorName: it.colorName, colorHex: it.colorHex,
        buyUrl: p.ok ? p.url : '',
        buyPlatform: p.ok ? p.platformLabel : ((live && live.buyPlatform) || it.buyPlatform || '')
      };
    })
  };
  state.favorites.unshift(snapshot);
  if(state.favorites.length > CONFIG.LIMITS.maxFavorites) state.favorites.length = CONFIG.LIMITS.maxFavorites;
  if(!state.feedback.likedKeys.includes(key)) state.feedback.likedKeys.push(key);
  persistOrWarn();
  render();
  toast('已收藏，可在「我的」导出图片');
}
function buildReasonPayload(look){
  const style = getStyle(look.styleId);
  const likedProfiles = state.refs
    .filter(r=>r.liked===true && r.profile)
    .slice(0,1)
    .map(r=>({标签:r.profile.tags, 配色:r.profile.palette, 廓形:r.profile.silhouette, 气质:r.profile.mood}));
  return {
    风格: {名称: style.name, 气质: style.mood, 关键词: style.keywords},
    季节: look.season,
    单品: look.items.map(it=>({
      名称: it.name, 品类: categoryLabel(it.category), 主色: it.colorName,
      材质: it.material, 正式度: it.formality
     })),
    评分: look.breakdown,
    参考风格画像: likedProfiles,
    本地草稿: look.reason
  };
}
async function requestLookReason(look, signal){
  const content = await aiChat({
    messages: [
      { role:'system', content: PROMPTS.reasonSystem },
      { role:'user', content: PROMPTS.reasonUser(buildReasonPayload(look)) }
    ],
    model: aiConfig.textModel || aiConfig.visionModel,
    maxTokens: CONFIG.AI.reasonMaxTokens,
    temperature: CONFIG.AI.reasonTemperature,
    signal
  });
  const obj = parseJSONFromModel(content);
  const text = String(obj['理由'] || obj.reason || obj.text || '').trim();
  if(!text) throw new AIError('模型没有返回可用理由','empty');
  return text.slice(0, 320);
}
function refreshLookReason(key){
  const card = Array.from(document.querySelectorAll('[data-look]')).find(el=>el.dataset.look===key);
  if(!card) return;
  const look = findLook(key) || (ui.pool||[]).find(l=>l.key===key);
  if(!look) return;
  const body = card.querySelector('[data-reason-body]');
  const tag = card.querySelector('[data-reason-tag]');
  if(body) body.textContent = look.reason;
  if(tag) tag.innerHTML = reasonStatusMarkup(look);
}
async function polishVisibleLooks(limit){
  if(!isAIConfigured() || ui.job) return;
  const looks = ui.outfits.slice(0, limit || 3);
  if(!looks.length) return;
  const job = beginJob('AI 润色搭配理由','准备中');
  let failures = 0;
  let firstError = '';
  for(let i=0;i<looks.length;i++){
    if(job.cancelled) break;
    const look = looks[i];
    look.aiReasonState = 'loading';
    refreshLookReason(look.key);
    updateJob('AI 润色搭配理由', `第 ${i+1}/${looks.length} 套 · ${look.styleName}`);
    try{
      const text = await requestLookReason(look, job.controller.signal);
      look.reason = text;
      look.reasonSource = 'ai';
      look.aiReasonState = 'done';
      const fav = state.favorites.find(f=>f.key===look.key);
      if(fav){ fav.reason = text; fav.reasonSource = 'ai'; }
    }catch(err){
      look.aiReasonState = 'failed';
      if(err && err.kind==='cancelled') break;
      failures++;
      if(!firstError) firstError = friendlyAIError(err);
    }
    refreshLookReason(look.key);
  }
  const pending = ui.outfits.filter(l=>l.aiReasonState==='loading');
  pending.forEach(l=>{ l.aiReasonState='idle'; refreshLookReason(l.key); });
  persistOrWarn();
  endJob(job);
  if(job.cancelled){
    toast('已取消 AI 润色，理由保留本地模板');
  }else if(failures){
    toast('AI 润色失败：'+firstError);
  }
}
async function polishSingleLook(key){
  const look = findLook(key);
  if(!look) return;
  if(!isAIConfigured()){
    toast('未配置 AI：请到「我的」选择预设并填写 API Key');
    switchTab('me');
    setTimeout(()=>{
      const card = $('#aiSettings');
      if(card) card.scrollIntoView({behavior:'smooth',block:'start'});
    },120);
    return;
  }
  if(ui.job){ toast('还有 AI 任务在进行，请先等待或取消'); return; }
  const job = beginJob('AI 润色搭配理由','正在重写这一套');
  look.aiReasonState = 'loading';
  refreshLookReason(key);
  try{
    const text = await requestLookReason(look, job.controller.signal);
    look.reason = text;
    look.reasonSource = 'ai';
    look.aiReasonState = 'done';
    const fav = state.favorites.find(f=>f.key===look.key);
    if(fav){ fav.reason = text; fav.reasonSource = 'ai'; }
    persistOrWarn();
    endJob(job);
    refreshLookReason(key);
    toast('理由已由 AI 重写');
  }catch(err){
    look.aiReasonState = 'failed';
    endJob(job);
    refreshLookReason(key);
    if(err && err.kind==='cancelled') toast('已取消');
    else toast('润色失败：'+friendlyAIError(err));
  }
}

async function testAISettings(){
  setTestButtonBusy('testAISettings', true);
  try{
    readAIForm();
    if(!isValidBaseUrl(aiConfig.baseUrl)){
      setTestResult('err','Base URL 需以 http:// 或 https:// 开头，例如 https://api.openai.com/v1');
      return;
    }
    if(!aiConfig.apiKey){
      setTestResult('err','请先填写 API Key（通义、方舟、OpenAI 都需在各自控制台创建）');
      return;
    }
    if(!aiConfig.visionModel && !aiConfig.textModel){
      setTestResult('err','请至少填写一个模型；豆包/方舟要填推理接入点 ID（ep-xxxx）');
      return;
    }
    saveAIConfigToDisk();
    updateModePill();
    setTestResult('loading','正在连接，最长等待 30 秒…');
    try{
      const cfg = Object.assign({}, aiConfig);
      const result = await testAIConnection(cfg);
      setTestResult('ok','连接成功 · '+result.ms+'ms · 模型回复：'+(result.text||'（空）'));
      toast('连接成功，可以使用 AI 功能了');
    }catch(err){
      const msg = friendlyAIError(err);
      recordAIFailure('文本测试', err);
      let action = '建议：检查 Key 是否完整、Base URL 是否匹配当前预设；豆包/方舟请确认填的是推理接入点 ID；若浏览器直连被 CORS 拦截，请改用支持 CORS 的代理网关。';
      setTestResult('err', '连接失败：'+msg+' '+action);
      toast('连接失败：'+msg);
    }
  }catch(err){
    setTestResult('err', '测试异常：'+(err && err.message ? err.message : err));
  }finally{
    setTestButtonBusy('testAISettings', false);
    refreshAIDiag();
  }
}
/* 点击后立刻进入禁用 + “测试中…”，避免用户以为没反应 */
function setTestButtonBusy(action, busy){
  const list = document.querySelectorAll('button[data-action="'+action+'"]');
  for(let i=0;i<list.length;i++){
    const b = list[i];
    if(busy){
      if(!b.dataset.idleLabel) b.dataset.idleLabel = b.textContent;
      b.disabled = true;
      b.textContent = '测试中…';
    }else{
      b.disabled = false;
      if(b.dataset.idleLabel){ b.textContent = b.dataset.idleLabel; delete b.dataset.idleLabel; }
    }
  }
}

/* 探测结果面板 */
function visionProbeMarkup(){
  const p = ui.visionProbe;
  if(!p) return '';
  const rows = (p.results || []).map(r=>`
    <div class="probe-item ${r.ok ? 'ok' : ''}">
      <span class="probe-model">${esc(r.model)}</span>
      <span class="probe-status ${r.ok ? 'ok' : 'bad'}">${esc(r.label)}</span>
      <span class="probe-ms">${r.ms == null ? '—' : (r.ms + ' ms')}</span>
      ${r.ok ? `<button class="btn btn-xs btn-soft" data-action="probeUseModel" data-model="${esc(r.model)}">填入该模型</button>` : ''}
    </div>`).join('');
  const progress = p.running
    ? `<div class="probe-progress">正在试第 ${Math.min(p.index + 1, p.total)} / ${p.total} 个：${esc(p.current || '')}…</div>`
    : '';
  const cancel = p.running ? `<button class="btn btn-xs btn-ghost" data-action="probeVisionCancel">取消</button>` : '';
  const useBtn = (!p.running && p.okModel)
    ? `<button class="btn btn-xs btn-primary" data-action="probeUseModel" data-model="${esc(p.okModel)}">填入该模型</button>`
    : '';
  const concl = p.conclusion
    ? `<div class="probe-concl ${p.okModel ? 'ok' : ''}">${esc(p.conclusion)}${useBtn}</div>`
    : '';
  return `<div class="probe-box">
    <div class="probe-head"><strong>视觉模型探测</strong>${cancel}</div>
    ${progress}${rows}${concl}
  </div>`;
}

function updateProbeBox(){
  const box = $('#visionProbeBox');
  if(box) box.innerHTML = visionProbeMarkup();
}

function probeLabelOf(err){
  const status = (err && err.status) || 0;
  const kind = (err && err.kind) || '';
  if(status===404 || kind==='notfound') return '404 模型不存在';
  if(status===403) return '403 无权限';
  if(status===401 || kind==='auth') return '401 鉴权失败';
  if(status===429 || kind==='rate') return '429 限流';
  if(kind==='timeout') return '超时';
  if(kind==='network') return '网络失败';
  return '其他错误';
}

function probeConclusion(p){
  if(p.cancelled) return p.okModel ? ('已取消，已找到可用模型：' + p.okModel) : '已取消探测';
  if(p.okModel) return '找到可用视觉模型：' + p.okModel + '（共测 ' + p.results.length + ' 个）';
  const labels = p.results.map(r=>r.label);
  const notFound = labels.filter(l=>/^404/.test(l)).length;
  const forbidden = labels.filter(l=>/^401|^403/.test(l)).length;
  const parts = ['候选型号已全部试过（共 ' + p.results.length + ' 个），均不可用。'];
  if(notFound) parts.push('404 表示该型号名在服务端未注册（可能写错，或该区域没有这个型号）；');
  if(forbidden) parts.push('403 表示型号存在，但当前账号没有授权：未开通、欠费/额度用尽，或 RAM 子账号缺权；');
  parts.push('这不是模型名的问题，请在账号层面处理：到控制台「模型广场」开通对应视觉模型、检查余额与免费额度是否覆盖 VL、确认账号已实名；若是 RAM 子账号，请让主账号授权。');
  const alt = [];
  if(aiConfig.preset !== 'zhipu') alt.push('智谱 AI（glm-4v-flash 免费识图）');
  if(aiConfig.preset !== 'siliconflow') alt.push('硅基流动（托管 Qwen VL，注册送额度）');
  if(alt.length) parts.push('短期无法开通可换平台：' + alt.join(' 或 ') + '，两家都是 OpenAI 兼容，填 Key 即可用。');
  return parts.join('');
}

/* 探测候选：跟随当前预设，自定义预设只探测已填写的型号 */
function probeCandidates(){
  const preset = CONFIG.AI.presets[aiConfig.preset] || {};
  if(preset.visionOptions && preset.visionOptions.length) return preset.visionOptions.slice(0, 5);
  const cur = String(aiConfig.visionModel || '').trim();
  return cur ? [cur] : [];
}

/* 逐个串行试探候选模型，最多 5 个，单个 20 秒，可取消 */
async function probeVisionModels(){
  const cur = ui.visionProbe;
  if(cur && cur.running) return;
  readAIForm();
  if(!isValidBaseUrl(aiConfig.baseUrl)){ toast('Base URL 需以 http:// 或 https:// 开头'); return; }
  if(!aiConfig.apiKey){ toast('请先填写 API Key'); return; }
  saveAIConfigToDisk();
  updateModePill();
  const preset = CONFIG.AI.presets[aiConfig.preset] || {};
  const list = probeCandidates();
  if(!list.length){ toast('请先填写视觉模型名，或切换带候选列表的预设'); return; }
  const token = { running:true, cancelled:false, index:0, total:list.length, current:'', results:[], done:false, conclusion:'', okModel:'' };
  ui.visionProbe = token;
  updateProbeBox();
  const cfg = Object.assign({}, aiConfig);
  for(let i=0;i<list.length;i++){
    if(token.cancelled || ui.visionProbe !== token) break;  // 串行：上一个 await 结束才试下一个
    token.index = i;
    token.current = list[i];
    updateProbeBox();
    const t0 = Date.now();
    try{
      const r = await testVisionConnection(cfg, list[i], 20000);
      token.results.push({ model:list[i], ok:true, label:'通过', ms:r.ms });
      if(!token.okModel) token.okModel = list[i];
    }catch(err){
      token.results.push({ model:list[i], ok:false, label:probeLabelOf(err), ms:Date.now() - t0 });
    }
    updateProbeBox();
    if(token.okModel) break;  // 找到可用模型即停止，失败才继续下一个
  }
  token.running = false;
  token.done = true;
  token.conclusion = probeConclusion(token);
  updateProbeBox();
}

function canvasRoundRect(ctx,x,y,w,h,r){
  const radius = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+radius, y);
  ctx.arcTo(x+w, y, x+w, y+h, radius);
  ctx.arcTo(x+w, y+h, x, y+h, radius);
  ctx.arcTo(x, y+h, x, y, radius);
  ctx.arcTo(x, y, x+w, y, radius);
  ctx.closePath();
}
function drawCover(ctx,img,x,y,w,h,r){
  ctx.save();
  canvasRoundRect(ctx,x,y,w,h,r||0);
  ctx.clip();
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;
  if(!iw || !ih){
    ctx.fillStyle='#e9e0d2';
    ctx.fillRect(x,y,w,h);
    ctx.restore();
    return;
  }
  const scale = Math.max(w/iw, h/ih);
  const sw = w/scale;
  const sh = h/scale;
  const sx = (iw-sw)/2;
  const sy = (ih-sh)/2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  ctx.restore();
}
function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  const chars = String(text||'').split('');
  let line = '';
  let lines = 0;
  let cursorY = y;
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, cursorY);
      lines++;
      cursorY += lineHeight;
      line = chars[i];
      if(lines>=maxLines){
        return cursorY;
      }
    }else{
      line = test;
    }
  }
  if(line && lines<maxLines){
    ctx.fillText(line, x, cursorY);
    cursorY += lineHeight;
  }
  return cursorY;
}
async function buildFavoriteCanvas(fav){
  const W = 1080;
  const H = 1440;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  if(!ctx) throw new Error('浏览器不支持 Canvas');
  const font = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  ctx.fillStyle = '#e9e1d4';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fffdf8';
  canvasRoundRect(ctx, 36, 36, W-72, H-72, 36);
  ctx.fill();

  ctx.textAlign = 'left';
  ctx.fillStyle = '#a45a38';
  ctx.font = '700 24px '+font;
  ctx.fillText('衣橱灵感 · OUTFIT NOTE', 100, 136);

  ctx.fillStyle = '#8d8578';
  ctx.font = '400 20px '+font;
  ctx.textAlign = 'right';
  ctx.fillText(DATE_LABEL(fav.createdAt), W-100, 136);

  ctx.fillStyle = '#211f1b';
  ctx.font = '700 56px '+font;
  ctx.textAlign = 'left';
  ctx.fillText(fav.styleName, 100, 222);

  ctx.fillStyle = '#847d70';
  ctx.font = '400 24px '+font;
  ctx.fillText(fav.season+' · 只用我自己的衣服 · '+fav.items.length+' 件', 100, 268);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#a45a38';
  ctx.font = '700 72px '+font;
  ctx.fillText(String(fav.score), W-150, 232);
  ctx.fillStyle = '#a45a38';
  ctx.font = '400 24px '+font;
  ctx.fillText('分', W-100, 232);

  const items = fav.items.slice(0,6);
  const urls = items.map(it=>{
    const u = favoriteItemImage(it);
    return /^data:/i.test(String(u||'')) ? u : '';
  });
  const images = await Promise.all(urls.map(u=>u ? loadImage(u).catch(()=>null) : Promise.resolve(null)));

  const cols = Math.min(3, Math.max(1, items.length));
  const rows = Math.ceil(items.length / cols);
  const areaX = 100;
  const areaY = 320;
  const areaW = 880;
  const areaH = 580;
  const gap = 18;
  const cellW = (areaW - gap*(cols-1))/cols;
  const cellH = (areaH - gap*(rows-1))/rows;
  for(let i=0;i<items.length;i++){
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = areaX + col*(cellW+gap);
    const y = areaY + row*(cellH+gap);
    const imgH = cellH - 44;
    ctx.fillStyle = '#efe6d8';
    canvasRoundRect(ctx, x, y, cellW, imgH, 16);
    ctx.fill();
    if(images[i]) drawCover(ctx, images[i], x, y, cellW, imgH, 16);
    ctx.fillStyle = '#4c463d';
    ctx.font = '400 18px '+font;
    ctx.textAlign = 'left';
    ctx.fillText(items[i].name.slice(0,16), x+2, y+imgH+22);
    const platform = items[i].buyPlatform || (items[i].buyUrl ? shopPlatformLabelOf(items[i].buyUrl) : '');
    ctx.fillStyle = platform ? '#a45a38' : '#9a9184';
    ctx.font = '400 14px '+font;
    ctx.fillText(platform ? platform : '未配链接', x+2, y+imgH+41);
  }

  ctx.strokeStyle = 'rgba(46,39,29,.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(100, 930);
  ctx.lineTo(W-100, 930);
  ctx.stroke();

  ctx.fillStyle = '#a45a38';
  ctx.font = '700 20px '+font;
  ctx.textAlign = 'left';
  ctx.fillText('搭 配 理 由', 100, 976);

  ctx.fillStyle = '#35302a';
  ctx.font = '400 30px '+font;
  wrapCanvasText(ctx, fav.reason, 100, 1026, 880, 46, 4);

  ctx.fillStyle = '#847d70';
  ctx.font = '400 21px '+font;
  const itemLine = '单品：'+fav.items.map(it=>it.name).join(' · ');
  wrapCanvasText(ctx, itemLine, 100, 1254, 880, 34, 2);

  ctx.strokeStyle = 'rgba(46,39,29,.12)';
  ctx.beginPath();
  ctx.moveTo(100, 1340);
  ctx.lineTo(W-100, 1340);
  ctx.stroke();

  ctx.fillStyle = '#9a9184';
  ctx.font = '400 18px '+font;
  ctx.fillText('RULE-BASED STYLING · 组合由本地规则引擎生成，AI 仅润色文字', 100, 1382);

  return canvas;
}
async function exportFavorite(id){
  const fav = state.favorites.find(f=>f.id===id);
  if(!fav) return;
  toast('正在合成搭配卡片…');
  try{
    const canvas = await buildFavoriteCanvas(fav);
    const blob = await new Promise(resolve=>{
      if(canvas.toBlob) canvas.toBlob(resolve, 'image/png');
      else resolve(null);
    });
    if(!blob) throw new Error('浏览器不支持导出 PNG');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '衣橱灵感-'+DATE_LABEL(fav.createdAt).replace(/\//g,'-')+'-'+fav.score+'分.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast('PNG 已导出');
  }catch(err){
    toast('导出失败：'+(err&&err.message?err.message:'Canvas 异常'));
  }
}

async function parseRefProfileWithAI(ref, signal){
  const aiUrl = await imageToAIDataUrl(ref.image);
  const content = await aiChat({
    messages: visionMessages(PROMPTS.refSystem, PROMPTS.refUser, aiUrl),
    model: aiConfig.visionModel || aiConfig.textModel,
    maxTokens: CONFIG.AI.refMaxTokens,
    temperature: CONFIG.AI.temperature,
    timeoutMs: CONFIG.AI.visionTimeoutMs,
    signal
  });
  const profile = normalizeAIProfile(parseJSONFromModel(content));
  ref.profile = profile;
  ref.tagSource = 'ai';
  if(profile.styleId) ref.styleId = profile.styleId;
  return profile;
}

async function handleRefFiles(files){
  const batch = Array.from(files||[]).slice(0, CONFIG.LIMITS.maxBatch);
  if(!batch.length) return;
  if(ui.job){ toast('还有 AI 任务在进行，请先等待或取消'); return; }
  const job = beginJob('处理参考图','准备压缩…');
  let imported = 0;
  let aiFailed = 0;
  let lastAIError = '';
  for(let i=0;i<batch.length;i++){
    if(job.cancelled) break;
    updateJob('处理参考图', `第 ${i+1}/${batch.length} 张 · 本地压缩`);
    let processed;
    try{
      processed = await processImageFile(batch[i]);
    }catch(err){
      toast('跳过 1 张：'+(err&&err.message?err.message:'图片读取失败'));
      continue;
    }
    if(!canStoreImage(processed.storeUrl)){
      toast('本地存储接近上限（约 3.5MB），先删几张参考图');
      break;
    }
    const ref = {
      id: uid(),
      image: processed.storeUrl,
      styleId: ui.outfitStyle || 'cleanfit',
      liked: null,
      profile: null,
      tagSource:'local',
      createdAt: Date.now()
    };
    state.refs.unshift(ref);
    persistOrWarn();
    imported++;
    if(isAIConfigured() && !job.cancelled){
      updateJob('AI 解析风格中', `第 ${i+1}/${batch.length} 张 · 提炼配色与廓形`);
      try{
        await parseRefProfileWithAI(ref, job.controller.signal);
        persistOrWarn();
      }catch(err){
        aiFailed++;
        lastAIError = friendlyAIError(err);
        ref.tagSource = 'local';
        if(err && err.kind==='cancelled'){
          persistOrWarn();
          break;
        }
      }
    }
  }
  endJob(job);
  if(imported) render();
  if(imported){
    let msg = `已加入 ${imported} 张参考`;
    if(aiFailed) msg += `，${aiFailed} 张仅保留手动标签`;
    toast(msg);
  }else{
    toast(job.cancelled ? '已取消' : '没有加入参考图');
  }
  if(aiFailed && lastAIError && !job.cancelled){
    setTimeout(()=>toast('AI 提示：'+lastAIError), 3000);
  }
}

const PLATFORM_MARK = { taobao:'淘', jd:'京', pdd:'拼', douyin:'抖', xhs:'红', other:'链' };

function platformTag(url, opts){
  const p = parseBuyUrl(url);
  if(!p.ok) return '';
  const full = Boolean(opts && opts.full);
  const mark = PLATFORM_MARK[p.platform] || '链';
  const idText = p.itemId ? ('ID ' + p.itemId) : '短链 / 未识别';
  return `<span class="platform-tag${full?' full':''}" title="${esc(p.platformLabel+' · '+(p.note||idText))}"><span class="pf-mark" style="background:${p.color}">${mark}</span><span class="pf-name">${esc(p.platformLabel)}</span>${full?`<span class="pf-id">${esc(idText)}</span>`:''}</span>`;
}

function buyPreviewMarkup(raw){
  const text = String(raw||'').trim();
  if(!text) return '<span class="buy-empty">粘贴后自动识别平台与商品 ID，可留空</span>';
  const p = parseBuyUrl(text);
  if(!p.ok) return `<span class="buy-bad">${esc(p.error)}</span>`;
  return `${platformTag(text,{full:true})}${p.note?`<span class="buy-note">${esc(p.note)}</span>`:''}`;
}

function isWeChatEnv(){
  return /MicroMessenger/i.test(String(navigator.userAgent||''));

function legacyCopyText(value, okMsg){
  try{
    const ta = document.createElement('textarea');
    ta.value = String(value||'');
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? (okMsg||'已复制') : '复制失败，请长按手动复制');
    return ok;
  }catch(e){
    toast('复制失败，请长按手动复制');
    return false;
  }
}

async function copyText(value, okMsg){
  const text = String(value||'');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText && /^https?:|^file:/i.test(location.protocol)){
      await navigator.clipboard.writeText(text);
      toast(okMsg || '已复制');
      return true;
    }
  }catch(e){ /* 继续走兜底 */ }
  return legacyCopyText(text, okMsg);
}

function parseLinkLines(text){
  const lines = String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0, 16);
  return lines.map(line=>{
    const clean = line.replace(/^[\s\-•·*]+/,'').replace(/^\d+[.、)]\s*/,'');
    const m = clean.match(/https?:\/\/[^\s，。；;、）)]+/i);
    const rawUrl = m ? m[0] : '';
    const note = clean.replace(rawUrl,'').replace(/[|,，;；]/g,' ').replace(/\s+/g,' ').trim().slice(0,40);
    if(!rawUrl){
      return { id:uid(), checked:false, name:'', category:'pending', colorName:'米白', price:'', buyUrl:'', platformLabel:'', itemId:'', unknown:true, note:'未找到 http(s) 链接' + (note?('：'+note):''), image:'' };
    }
    const p = parseBuyUrl(rawUrl);
    return {
      id: uid(), checked: p.ok, name:'', category:'pending', colorName:'米白', price:'',
      buyUrl: p.ok ? p.url : '', platformLabel: p.ok ? p.platformLabel : '', itemId: p.ok ? p.itemId : '',
      unknown: p.ok ? p.unknown : true, note: p.ok ? (note||p.note||'') : p.error, image:''
    };
  });
}

function normalizePriceText(value){
  if(value==null) return '';
  if(typeof value === 'number' && isFinite(value)) return ('¥' + value).slice(0,14);
  const s = String(value).trim();
  if(!s || /^(null|undefined|未知|无|—)$/i.test(s)) return '';
  const m = s.match(/\d+(?:\.\d{1,2})?/);
  if(!m) return '';
  return (/[¥￥$]/.test(s) ? s : ('¥' + m[0])).slice(0,14);
}

function guessCategoryFromName(name){
  const s = String(name||'');
  if(/鞋|靴|球鞋|乐福|玛丽珍|高跟鞋|凉鞋|拖鞋|sneaker|boot/i.test(s)) return 'shoes';
  if(/包|手袋|托特|双肩|腋下|bag/i.test(s)) return 'bag';
  if(/帽|围巾|腰带|项链|耳环|戒指|手套|墨镜|配饰|饰品/i.test(s)) return 'accessory';
  if(/连衣|连身|吊带裙|背心裙|dress/i.test(s)) return 'dress';
  if(/裤|半裙|短裙|长裙|裙|下装|pants|skirt/i.test(s)) return 'bottom';
  if(/外套|大衣|风衣|夹克|西装|羽绒|马甲|冲锋衣|coat|jacket/i.test(s)) return 'outer';
  if(/衫|开衫|t恤|T恤|衬衫|上衣|针织|卫衣|背心|吊带|polo|POLO|shirt|tee/i.test(s)) return 'top';
  return 'pending';
}

function parseTextLines(text){
  const PLATFORM_WORD = [
    { re:/淘宝|天猫|taobao|tmall/i, label:'淘宝/天猫' },
    { re:/京东|jd\.com|JD/i, label:'京东' },
    { re:/拼多多|pdd|yangkeduo/i, label:'拼多多' },
    { re:/抖音|douyin|抖店/i, label:'抖音' },
    { re:/小红书|xiaohongshu|xhs/i, label:'小红书' }
  ];
  return String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,16).map(line=>{
    const urlM = line.match(/https?:\/\/[^\s，。；;、）)]+/i);
    const rawUrl = urlM ? urlM[0] : '';
    const p = rawUrl ? parseBuyUrl(rawUrl) : { ok:false };
    const priceM = line.match(/(?:¥|￥|\$)\s*\d+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?\s*元/);
    const price = normalizePriceText(priceM ? priceM[0] : '');
    let rest = line.replace(rawUrl,'').replace(priceM?priceM[0]:'','').replace(/[|,，;；:：]/g,' ').replace(/\s+/g,' ').trim();
    PLATFORM_WORD.forEach(pw=>{ rest = rest.replace(pw.re,' '); });
    if(!p.ok) PLATFORM_WORD.forEach(pw=>{ if(pw.re.test(line)) p.platformLabel = pw.label; });
    if(p.ok) p.platformLabel = p.platformLabel;
    const name = rest.slice(0,24);
    const category = name ? guessCategoryFromName(name) : 'pending';
    return {
      id: uid(), checked: Boolean(name || p.ok), name, category,
      colorName:'米白', price,
      buyUrl: p.ok ? p.url : '',
      platformLabel: p.ok ? p.platformLabel : (p.platformLabel || ''),
      itemId: p.ok ? p.itemId : '', unknown:true,
      note: p.ok ? '' : (name ? '没有识别到商品链接，可导入后补充' : '这一行信息太少'),
      image:''
    };
  });
}

async function bulkConfirm(){
  const box = $('#bulkText');
  if(ui.bulk && box) ui.bulk.text = box.value;
  const mode = (ui.bulk && ui.bulk.mode) || 'links';
  const text = (ui.bulk && ui.bulk.text) || '';
  if(!text.trim()){ toast(mode==='links'?'请先粘贴至少一条链接':'请先粘贴商品文字'); return; }
  let rows = mode==='links' ? parseLinkLines(text) : parseTextLines(text);
  if(!rows.length){ toast('没有可解析的内容，请检查格式'); return; }
  if(mode==='links' && isValidBaseUrl(aiConfig.proxyUrl)){
    if(ui.job){ toast('还有 AI 任务在进行，请先等待或取消'); return; }
    const job = beginJob('代理补全商品信息','正在通过你配置的代理读取标题与图片…');
    let ok = 0;
    for(let i=0;i<rows.length;i++){
      if(job.cancelled) break;
      const r = rows[i];
      if(!r.buyUrl) continue;
      updateJob('代理补全商品信息', `第 ${i+1}/${rows.length} 条`);
      const info = await proxyFetchProduct(r.buyUrl, job.controller.signal);
      if(info){
        r.name = info.title || r.name;
        r.image = info.image || r.image;
        r.price = info.price || r.price;
        ok++;
      }
    }
    endJob(job);
    if(ok) toast(`代理已补全 ${ok} 条商品信息`);
    else toast('代理未返回可用数据，已回退为手动补充名称');
  }
  ui.bulk = null;
  ui.importBatch = { source: mode==='links' ? 'links' : 'text', rows, failed:0 };
  render();
}

/* ---- 商品抓取代理（可选，自建；默认关闭） ---- */
function proxyEndpoint(base, url){
  const b = String(base||'').trim();
  if(!isValidBaseUrl(b)) return '';
  const sep = b.indexOf('?') >= 0 ? '&' : '?';
  return b + sep + 'url=' + encodeURIComponent(url);
}

async function proxyFetchProduct(url, signal){
  const endpoint = proxyEndpoint(aiConfig.proxyUrl, url);
  if(!endpoint) return null;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>{ try{ ctrl.abort(); }catch(e){} }, 8000);
  const relay = ()=>{ try{ ctrl.abort(); }catch(e){} };
  if(signal){
    if(signal.aborted) relay();
    else signal.addEventListener('abort', relay, { once:true });
  }
  try{
    const res = await fetch(endpoint, { method:'GET', signal: ctrl.signal, mode:'cors' });
    if(!res.ok) return null;
    const data = await res.json();
    const obj = (data && (data.data || data.result || data.item || data)) || {};
    const title = String(obj.title || obj.name || '').trim().slice(0,40);
    const rawImg = String(obj.image || obj.pic || obj.imageUrl || '').trim();
    const image = /^https?:\/\//i.test(rawImg) ? rawImg : '';
    const price = normalizePriceText(obj.price);
    if(!title && !image) return null;
    return { title, image, price };
  }catch(e){
    return null;
  }finally{
    clearTimeout(timer);
    if(signal) signal.removeEventListener('abort', relay);
  }
}

/* ---- 截图识别 ---- */
function shotCategoryOf(raw){
  const s = String(raw||'').trim();
  if(!s) return 'pending';
  if(/待分类|未分类|未知|其他|unknown|other/i.test(s)) return 'pending';
  const cat = normalizeCategory(s);
  if(cat !== 'top') return cat;
  return /上装|top|上衣|衬衫|针织|t恤|卫衣|背心|吊带/i.test(s) ? 'top' : 'pending';
}

/* 判定一组坐标属于哪种体系：norm / permille / px，判不准就返回 null（调用方退回整图） */
function resolveBoxUnit(vals, imgW, imgH){
  if(!vals || vals.length < 4) return null;
  const a = vals.slice(0, 4).map(Number);
  if(a.some(v=>!isFinite(v))) return null;
  const max = Math.max.apply(null, a.map(Math.abs));
  if(max <= 1) return 'norm';
  if(max <= 1000) return 'permille';
  if(imgW > 0 && imgH > 0) return 'px';
  return null;
}

/* 提取通义 VL 的 <box>(x1,y1),(x2,y2)</box> / <box>x1,y1,x2,y2</box> 标签 */
function parseBoxTags(text){
  const s = String(text || '')
    .replace(/[，、]/g, ',')
    .replace(/[（]/g, '(').replace(/[）]/g, ')')
    .replace(/＜/g, '<').replace(/＞/g, '>').replace(/／/g, '/')
    .replace(/[０-９]/g, ch=>String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  const re = /<\s*box\s*>([\s\S]*?)<\s*\/\s*box\s*>/gi;
  const out = [];
  let m;
  while((m = re.exec(s))){
    const nums = (m[1].match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
    if(nums.length === 4 && nums.every(v=>isFinite(v))) out.push({ a:nums, index:m.index, end:re.lastIndex });
  }
  return out;
}

/* 从「名称 + box」交替的文本里按顺序配对 */
function tagShotItems(text, tags){
  const s = String(text || '');
  const items = [];
  let prev = 0;
  for(let i=0;i<tags.length;i++){
    let seg = s.slice(prev, tags[i].index);
    prev = tags[i].end;
    seg = seg
      .replace(/<\s*box\s*>[\s\S]*?<\s*\/\s*box\s*>/gi, '')
      .replace(/^[\s,，。；;:：\-–—]+|[\s,，。；;:：\-–—]+$/g, '')
      .replace(/^第?[一二三四五六七八九十百0-9]+[件个样项条]?[是为:：]?/, '')
      .replace(/^[0-9]+[.、)）:：]/, '')
      .trim();
    items.push({ name: seg.slice(0, 24) || ('截图商品' + (i+1)), box: tags[i].a, boxKey: 'box_tag' });
  }
  return items;
}

/* JSON 条目不足时，用多余的标签补齐；多出来的标签直接丢弃 */
function mergeTagShotBoxes(arr, tags, text){
  if(!tags.length) return arr;
  const out = arr.slice();
  if(out.length < tags.length){
    const extra = tagShotItems(text, tags.slice(out.length));
    extra.forEach(it=>out.push(it));
  }
  return out;
}

function normalizeShotItem(obj){
  const o = (obj && typeof obj === 'object') ? obj : {};
  let nameRaw = String(o.name || o['名称'] || o['商品名'] || '').trim();
  const inlineTags = parseBoxTags(nameRaw);
  if(inlineTags.length) nameRaw = nameRaw.replace(/<\s*box\s*>[\s\S]*?<\s*\/\s*box\s*>/gi, '').trim();
  const name = /^(待补充名称|未知|无|未识别)$/.test(nameRaw) ? '' : nameRaw.slice(0,24);
  let category = shotCategoryOf(o.category || o['品类'] || '');
  if(category==='pending' && name) category = guessCategoryFromName(name);
  const colorName = normalizeColorName(o.color || o['主色'] || '米白');
  const styleArr = Array.isArray(o.style || o['风格']) ? (o.style || o['风格']) : [o.style || o['风格']];
  const styles = [];
  styleArr.forEach(s=>{ const id = normalizeStyleId(s); if(id && !styles.includes(id)) styles.push(id); });
  const seasons = normalizeSeasons(o.season || o['季节'] || []);
  const formality = clamp(Number(o.formality || o['正式度']) || 3, 1, 5);
  const price = normalizePriceText(o.price != null ? o.price : (o['价格'] != null ? o['价格'] : ''));
  const linkRaw = String(o.link || o['链接'] || '').trim();
  const p = linkRaw ? parseBuyUrl(linkRaw) : { ok:false };
  let platformLabel = p.ok ? p.platformLabel : '';
  if(!platformLabel && o.platform){
    const key = String(o.platform).toLowerCase();
    const pf = SHOP_PLATFORMS.find(x=>x.id===key || x.label.indexOf(String(o.platform))>=0);
    if(pf) platformLabel = pf.label;
  }
  let boxPick = (o.boxKey === 'box_tag' && Array.isArray(o.box))
    ? { key:'box_tag', value:o.box }
    : pickShotBox(o);
  if(!boxPick.value && inlineTags.length) boxPick = { key:'box_tag', value:inlineTags[0].a };
  return {
    name, category, colorName,
    styles: styles.slice(0,3),
    seasons: seasons.slice(0,3),
    formality, price,
    buyUrl: p.ok ? p.url : '',
    platformLabel,
    itemId: p.ok ? p.itemId : '',
    unknown: p.ok ? p.unknown : true,
    note: p.ok ? '' : (linkRaw ? '截图中的链接无法直接校验，导入后可补充' : ''),
    aiTag: true,
    box: boxPick.value,
    boxKey: boxPick.key
  };
}

/* 从整段文字里截出第一个完整的 JSON 数组/对象（忽略前后废话、代码围栏） */
function balancedJson(text){
  const s = String(text||'');
  let start = -1;
  for(let i=0;i<s.length;i++){ if(s[i]==='[' || s[i]==='{'){ start = i; break; } }
  if(start < 0) return '';
  const open = s[start], close = open==='[' ? ']' : '}';
  let depth = 0, inStr = false, esc = false;
  for(let i=start;i<s.length;i++){
    const ch = s[i];
    if(inStr){
      if(esc) esc = false;
      else if(ch === '\\') esc = true;
      else if(ch === '"') inStr = false;
      continue;
    }
    if(ch === '"'){ inStr = true; continue; }
    if(ch === open) depth++;
    else if(ch === close){ depth--; if(depth === 0) return s.slice(start, i+1); }
  }
  return '';
}

/* 兼容 {items:[...]} / {products:[...]} / {data:{results:[...]}} / 直接数组 */
function unwrapShotList(v, depth){
  const d = depth || 0;
  if(d > 5) return null;
  if(Array.isArray(v)) return v;
  if(!v || typeof v !== 'object') return null;
  const keys = ['items','products','results','list','data','result','product_list','goods','commodities','商品','单品','data'];
  for(let i=0;i<keys.length;i++){
    const inner = v[keys[i]];
    if(inner == null) continue;
    if(typeof inner === 'string'){
      try{ const j = JSON.parse(inner); const r = unwrapShotList(j, d+1); if(r) return r; }catch(e){}
      continue;
    }
    const r = unwrapShotList(inner, d+1);
    if(r) return r;
  }
  return null;
}

/* 输出被 token 上限截断时：按顶层对象逐条挽救，只保留完整条目 */
function salvageJsonArray(text){
  const s = String(text||'');
  const start = s.indexOf('[');
  if(start < 0) return [];
  let depth = 0, inStr = false, esc = false;
  const ends = [];
  for(let i=start+1;i<s.length;i++){
    const ch = s[i];
    if(inStr){
      if(esc) esc = false;
      else if(ch === '\\') esc = true;
      else if(ch === '"') inStr = false;
      continue;
    }
    if(ch === '"'){ inStr = true; continue; }
    if(ch === '{') depth++;
    else if(ch === '}'){ depth--; if(depth === 0) ends.push(i); }
  }
  for(let k=ends.length-1;k>=0;k--){
    const json = s.slice(start, ends[k]+1) + ']';
    const tries = [json, json.replace(/,\s*([}\]])/g,'$1')];
    for(let t=0;t<tries.length;t++){
      try{
        const arr = JSON.parse(tries[t]);
        if(Array.isArray(arr) && arr.length) return arr;
      }catch(e){}
    }
  }
  return [];
}

function parseShotsArray(text){
  let s = String(text||'').trim().replace(/^\uFEFF/,'');
  const tags = parseBoxTags(s);
  const fenced = s.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if(fenced) s = fenced[1].trim();
  const candidates = [s];
  const block = balancedJson(s);
  if(block && block !== s) candidates.push(block);
  for(let ci=0;ci<candidates.length;ci++){
    let v;
    try{ v = JSON.parse(candidates[ci]); }
    catch(e){
      try{ v = JSON.parse(candidates[ci].replace(/,\s*([}\]])/g,'$1')); }
      catch(e2){ continue; }
    }
    let guard = 0;
    while(typeof v === 'string' && guard++ < 3){
      try{ v = JSON.parse(v); }catch(e){ break; }
    }
    const arr = unwrapShotList(v);
    if(Array.isArray(arr)) return mergeTagShotBoxes(arr, tags, s);
  }
  const start = s.indexOf('[');
  const end = s.lastIndexOf(']');
  if(start !== -1 && end > start){
    const json = s.slice(start, end+1);
    try{ return mergeTagShotBoxes(JSON.parse(json), tags, s); }
    catch(e){
      try{ return mergeTagShotBoxes(JSON.parse(json.replace(/,\s*([}\]])/g,'$1')), tags, s); }catch(e2){}
    }
  }
  try{
    const obj = parseJSONFromModel(s);
    const arr = obj['商品'] || obj['单品'] || obj.items || obj.data || obj.result;
    if(Array.isArray(arr)) return mergeTagShotBoxes(arr, tags, s);
  }catch(e){}
  /* JSON 被 max_tokens 截断：逐条挽救已完整的对象，不整批失败 */
  const salvaged = salvageJsonArray(s);
  if(salvaged.length){
    const out = mergeTagShotBoxes(salvaged, tags, s);
    out.truncated = true;
    return out;
  }
  if(tags.length) return tagShotItems(s, tags);
  throw new AIError('模型返回的商品清单无法解析','parse');
}

async function parseShotsWithAI(imageUrl, signal){
  const content = await aiChat({
    messages: visionMessages(PROMPTS.shotsSystem, PROMPTS.shotsUser, imageUrl),
    model: aiConfig.visionModel || aiConfig.textModel,
    maxTokens: CONFIG.AI.shotsMaxTokens,
    temperature: CONFIG.AI.temperature,
    timeoutMs: CONFIG.AI.visionTimeoutMs,
    signal
  });
  const arr = parseShotsArray(content);
  if(!Array.isArray(arr)) throw new AIError('模型没有返回商品数组','parse');
  const overflow = arr.length > 8;
  const out = arr.slice(0,8).map(normalizeShotItem).filter(x=>x.name || x.buyUrl || x.category!=='pending' || x.price);
  if(!out.length) throw new AIError('模型返回空清单，或返回的字段全部无法解析','empty');
  return { items: out, truncated: Boolean(arr.truncated) || overflow };
}

/* 出框质量闸：box 面积 > 整图 85% 视为未贴合主体，退回原图并由用户手动重设 */
function buildShotRow(item, processed, shotIndex){
  const nx = normalizeShotBox(item.box, processed.w, processed.h, item.boxKey);
  const area = nx ? (nx.w * nx.h) : 0;
  const oversize = Boolean(nx) && area > 0.85;
  let image = processed.storeUrl, whole = true;
  if(nx && !oversize){
    const cropped = cropShotImage(processed.img, nx);
    if(cropped){ image = cropped; whole = false; }
  }
  return Object.assign({
    id: uid(), checked:true, shotIndex, source:'screenshot'
  }, item, {
    image, box: oversize ? null : nx, whole,
    shotUrl: processed.storeUrl, oversize, boxArea: area
  });
}

async function processShotFile(file){
  if(!file) throw new Error('没有文件');
  if(!/^image\//i.test(file.type || '')) throw new Error('不是图片文件');
  if(file.size > 20*1024*1024) throw new Error('单张图片超过 20MB');
  const objectUrl = URL.createObjectURL(file);
  try{
    const img = await loadImage(objectUrl);
    if(!img || !img.naturalWidth) throw new Error('图片读取失败');
    let storeUrl = renderImageToDataUrl(img, 720, 0.68);
    if(storeUrl.length > 170*1024) storeUrl = renderImageToDataUrl(img, 560, 0.6);
    if(storeUrl.length > 170*1024) storeUrl = renderImageToDataUrl(img, 460, 0.55);
    const aiUrl = renderImageToDataUrl(img, CONFIG.LIMITS.aiImageEdge, CONFIG.LIMITS.aiImageQuality);
    return { storeUrl, aiUrl, img, w: img.naturalWidth || img.width, h: img.naturalHeight || img.height };
  }finally{
    try{ URL.revokeObjectURL(objectUrl); }catch(e){}
  }
}

/* 宽容解析模型返回的数字：支持 "0.35"、"12%"、负数 */
function shotNum(v){
  if(typeof v === 'number') return isFinite(v) ? v : NaN;
  if(typeof v !== 'string') return NaN;
  const t = v.trim();
  if(!t) return NaN;
  const n = parseFloat(t);
  if(!isFinite(n)) return NaN;
  return /%$/.test(t) ? n / 100 : n;
}

/* 从商品的多个候选字段里取 box（不同厂商字段名不同） */
function pickShotBox(o){
  const keys = ['box','bbox_2d','bbox2d','bbox','box_2d','coordinates','region','crop','rect','bounds','location','框','区域'];
  for(let i=0;i<keys.length;i++){
    const k = keys[i];
    if(o[k] != null && o[k] !== '') return { key:k, value:o[k] };
  }
  return { key:'', value:null };
}

/* 把模型返回的 box 归一化：兼容 0~1 / 0~1000 / 像素 / 数组 / 字符串 / 百分比 / 越界 */
function normalizeShotBox(raw, imgW, imgH, keyHint){
  const key = String(keyHint || '').toLowerCase();
  const W = Number(imgW) || 0, H = Number(imgH) || 0;
  let val = raw;
  if(typeof val === 'string'){
    const t = val.trim();
    if(!t) return null;
    if(t.charAt(0) === '[' || t.charAt(0) === '{'){
      try{ val = JSON.parse(t); }catch(e){ val = t; }
    }
    if(typeof val === 'string'){
      const nums = val.match(/-?\d+(?:\.\d+)?%?/g);
      if(!nums || nums.length < 4) return null;
      val = nums.slice(0, 4);
    }
  }
  let x, y, w, h;
  if(Array.isArray(val)){
    const a = val.slice(0, 4).map(shotNum);
    if(a.length < 4 || a.some(v=>!isFinite(v))) return null;
    const allNorm = a.every(v=>Math.abs(v) <= 1);
    let p;
    if(key === 'box_tag'){
      // 通义标签：x1,y1,x2,y2；坐标体系交给纯函数判定
      const unit = resolveBoxUnit(a, W, H);
      if(!unit) return null;
      if(unit === 'px'){
        x = a[0]/W; y = a[1]/H; w = (a[2]-a[0])/W; h = (a[3]-a[1])/H;
      }else{
        const k = unit === 'permille' ? 1000 : 1;
        x = a[0]/k; y = a[1]/k; w = (a[2]-a[0])/k; h = (a[3]-a[1])/k;
      }
    }else if(/2d/.test(key)){
      // Gemini / 部分 VL：顺序固定为 [ymin,xmin,ymax,xmax]，0~1000 或 0~1
      const k = allNorm ? 1 : 1000;
      x = a[1]/k; y = a[0]/k; w = (a[3]-a[1])/k; h = (a[2]-a[0])/k;
    }else if(!allNorm){
      // 像素坐标：默认按 [x,y,w,h]
      if(!W || !H) return null;
      p = [a[0]/W, a[1]/H, a[2]/W, a[3]/H];
      if(a[2] > a[0] && a[3] > a[1] && (a[0]+a[2] > W) && (a[1]+a[3] > H)){
        // x+w、y+h 已超出图幅，更像两点式 [x1,y1,x2,y2]
        x = p[0]; y = p[1]; w = p[2]-p[0]; h = p[3]-p[1];
      }else{
        x = p[0]; y = p[1]; w = p[2]; h = p[3];
      }
    }else{
      // 归一化数组：x2>x1 且 y2>y1 且差值够大 → 两点式，否则按宽高式
      const two = a[2] > a[0] && a[3] > a[1] && (a[2]-a[0]) > 0.02 && (a[3]-a[1]) > 0.02;
      if(two){ x = a[0]; y = a[1]; w = a[2]-a[0]; h = a[3]-a[1]; }
      else { x = a[0]; y = a[1]; w = a[2]; h = a[3]; }
    }
  }else if(val && typeof val === 'object'){
    const g = (a,b)=> (a != null ? shotNum(a) : (b != null ? shotNum(b) : NaN));
    x = g(val.x, val.left);
    y = g(val.y, val.top);
    w = g(val.w, val.width);
    h = g(val.h, val.height);
    if(![x,y,w,h].every(v=>isFinite(v))){
      // 第二组写法：x1/y1/x2/y2、xmin/ymin/xmax/ymax（含 y 在前的 2d 对象）
      const x1 = g(val.x1, val.xmin), y1 = g(val.y1, val.ymin);
      const x2 = g(val.x2, val.xmax), y2 = g(val.y2, val.ymax);
      if([x1,y1,x2,y2].every(v=>isFinite(v))){
        const permille = /2d/.test(key) && Math.max(Math.abs(x1),Math.abs(y1),Math.abs(x2),Math.abs(y2)) > 1;
        const k = permille ? 1000 : 1;
        x = x1/k; y = y1/k; w = (x2-x1)/k; h = (y2-y1)/k;
      }else{
        return null;
      }
    }
    if(![x,y,w,h].every(v=>isFinite(v))) return null;
    // 像素坐标：值 > 1 且非百分比，按图片实际宽高换算
    if(x > 1 || y > 1 || w > 1 || h > 1){
      if(!W || !H) return null;
      if(x > 1) x = x / W;
      if(y > 1) y = y / H;
      if(w > 1) w = w / W;
      if(h > 1) h = h / H;
    }
  }else{
    return null;
  }
  if(![x,y,w,h].every(v=>isFinite(v))) return null;
  if(w <= 0 || h <= 0) return null;
  const x2 = x + w, y2 = y + h;
  if(x2 <= 0 || y2 <= 0 || x >= 1 || y >= 1) return null;
  const nx = clamp(x, 0, 1), ny = clamp(y, 0, 1);
  const nx2 = clamp(x2, 0, 1), ny2 = clamp(y2, 0, 1);
  const nw = nx2 - nx, nh = ny2 - ny;
  if(nw <= 0.02 || nh <= 0.02) return null;
  return { x:+nx.toFixed(3), y:+ny.toFixed(3), w:+nw.toFixed(3), h:+nh.toFixed(3) };
}

/* 从原截图裁出 box 区域：四周留 2% 余量，长边 ≤640，JPEG 0.82 */
function cropShotImage(img, box, pad){
  if(!img || !box) return '';
  const W = img.naturalWidth || img.width;
  const H = img.naturalHeight || img.height;
  if(!W || !H) return '';
  const p = (typeof pad === 'number') ? pad : 0.02;
  const px = box.w * W, py = box.h * H;
  let sx = Math.round(box.x * W - px * p);
  let sy = Math.round(box.y * H - py * p);
  let sw = Math.round(px * (1 + p*2));
  let sh = Math.round(py * (1 + p*2));
  sx = Math.max(0, sx); sy = Math.max(0, sy);
  sw = Math.min(W - sx, sw); sh = Math.min(H - sy, sh);
  if(sw < 4 || sh < 4) return '';
  const scale = Math.min(1, 640 / Math.max(sw, sh));
  const cw = Math.max(1, Math.round(sw * scale));
  const ch = Math.max(1, Math.round(sh * scale));
  try{
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fbf8f1';
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
    return c.toDataURL('image/jpeg', 0.82);
  }catch(e){ return ''; }
}

async function cropShotFromUrl(url, box){
  if(!url || !box) return '';
  const img = await loadImage(url);
  return cropShotImage(img, box);
}

/* -----------------------------------------------------------------------------
   自动去背景（纯前端 · 边缘种子连通域）
   适合纯色/浅底商品图；模特穿着照与复杂背景效果有限，安全阀会自动保留原图
   ----------------------------------------------------------------------------- */
const BG_LEVELS = [
  { key:'weak', label:'弱', tol:26 },
  { key:'mid', label:'中', tol:48 },
  { key:'strong', label:'强', tol:78 }
];
function bgLevel(key){ return BG_LEVELS.find(l=>l.key===key) || BG_LEVELS[1]; }
/* 原图仅存内存（不写入 localStorage），供本次会话内「恢复原图」 */
const bgOriginalCache = new Map();

/* 从四周环带采样，按 4bit/通道分桶聚类出最多 3 个背景色 */
function sampleBgColors(data, w, h){
  const ring = Math.max(1, Math.round(Math.min(w,h)*0.02));
  const bins = new Map();
  const add = (x,y)=>{
    const i = (y*w+x)*4;
    if(data[i+3] < 8) return;
    const key = ((data[i]>>4)<<8) | ((data[i+1]>>4)<<4) | (data[i+2]>>4);
    let b = bins.get(key);
    if(!b){ b = { n:0, r:0, g:0, b:0 }; bins.set(key, b); }
    b.n++; b.r += data[i]; b.g += data[i+1]; b.b += data[i+2];
  };
  for(let y=0;y<h;y++) for(let x=0;x<ring;x++){ add(x,y); add(w-1-x,y); }
  for(let x=0;x<w;x++) for(let y=0;y<ring;y++){ add(x,y); add(x,h-1-y); }
  const list = [];
  bins.forEach(b=>list.push({ r:b.r/b.n, g:b.g/b.n, b:b.b/b.n, n:b.n }));
  list.sort((a,b)=>b.n-a.n);
  return list.slice(0,3);
}

/* 边缘像素作种子，BFS 把与背景色在容差内的连通像素标记为背景 */
function buildBgMask(data, w, h, tol){
  const total = w*h;
  const colors = sampleBgColors(data, w, h);
  if(!colors.length) return null;
  const tol2 = tol*tol;
  const near = (idx)=>{
    const i = idx*4;
    const r = data[i], g = data[i+1], b = data[i+2];
    for(let k=0;k<colors.length;k++){
      const c = colors[k];
      const dr = r-c.r, dg = g-c.g, db = b-c.b;
      if(dr*dr + dg*dg + db*db <= tol2) return true;
    }
    return false;
  };
  const mask = new Uint8Array(total);
  const stack = [];
  const seed = (idx)=>{ if(!mask[idx] && near(idx)){ mask[idx] = 1; stack.push(idx); } };
  for(let y=0;y<h;y++){ seed(y*w); seed(y*w+w-1); }
  for(let x=0;x<w;x++){ seed(x); seed((h-1)*w+x); }
  while(stack.length){
    const idx = stack.pop();
    const x = idx % w, y = (idx - x) / w;
    if(x>0) seed(idx-1);
    if(x<w-1) seed(idx+1);
    if(y>0) seed(idx-w);
    if(y<h-1) seed(idx+w);
  }
  return { mask, colors };
}

/* 收边 1~2px + 两圈羽化，返回每像素 alpha */
function buildBgAlpha(mask, w, h){
  const total = w*h;
  for(let pass=0; pass<2; pass++){
    const add = [];
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const idx = y*w+x;
        if(mask[idx]) continue;
        let n = 0;
        if(x>0 && mask[idx-1]) n++;
        if(x<w-1 && mask[idx+1]) n++;
        if(y>0 && mask[idx-w]) n++;
        if(y<h-1 && mask[idx+w]) n++;
        if(n>=2) add.push(idx);
      }
    }
    if(!add.length) break;
    for(let k=0;k<add.length;k++) mask[add[k]] = 1;
  }
  const alpha = new Uint8ClampedArray(total).fill(255);
  for(let i=0;i<total;i++) if(mask[i]) alpha[i] = 0;
  const edge = [];
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx = y*w+x;
      if(mask[idx]) continue;
      let touch = false;
      for(let dy=-1; dy<=1 && !touch; dy++){
        for(let dx=-1; dx<=1; dx++){
          if(!dx && !dy) continue;
          const nx = x+dx, ny = y+dy;
          if(nx<0 || ny<0 || nx>=w || ny>=h){ touch = true; break; }
          if(mask[ny*w+nx]){ touch = true; break; }
        }
      }
      if(touch) edge.push(idx);
    }
  }
  for(let k=0;k<edge.length;k++) alpha[edge[k]] = 150;
  for(let k=0;k<edge.length;k++){
    const idx = edge[k];
    const x = idx % w, y = (idx - x) / w;
    const nb = [x>0?idx-1:-1, x<w-1?idx+1:-1, y>0?idx-w:-1, y<h-1?idx+w:-1];
    for(let j=0;j<nb.length;j++){
      const n = nb[j];
      if(n<0 || mask[n] || alpha[n] !== 255) continue;
      alpha[n] = 205;
    }
  }
  return alpha;
}

/* 直接在 canvas 上改 alpha；安全阀不通过时不修改像素 */
function removeBgOnCanvas(canvas, levelKey){
  const w = canvas.width, h = canvas.height, total = w*h;
  if(!w || !h) return { ok:false, reason:'empty' };
  const ctx = canvas.getContext('2d', { willReadFrequently:true });
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const built = buildBgMask(data, w, h, bgLevel(levelKey).tol);
  if(!built) return { ok:false, reason:'empty' };
  const alpha = buildBgAlpha(built.mask, w, h);
  let removed = 0;
  for(let i=0;i<total;i++) if(alpha[i] < 8) removed++;
  const ratio = removed / total;
  const kept = 1 - ratio;
  /* 安全阀：<5% 几乎没去掉；>85% 可能误删主体；剩余不透明 <5% 视为失败 */
  if(ratio < 0.05 || ratio > 0.85 || kept < 0.05){
    return { ok:false, reason:'guard', removed:ratio };
  }
  for(let i=0;i<total;i++) data[i*4+3] = alpha[i];
  ctx.putImageData(imgData, 0, 0);
  return { ok:true, removed:ratio, kept:kept };
}

/* 输入 dataURL，长边压到 ≤640 后去背，输出 PNG（保留 alpha） */
async function removeBgDataUrl(src, levelKey){
  try{
    const img = await loadImage(src);
    const W = img && (img.naturalWidth || img.width);
    const H = img && (img.naturalHeight || img.height);
    if(!W || !H) return { ok:false, reason:'empty' };
    const scale = Math.min(1, 640/Math.max(W,H));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(W*scale));
    canvas.height = Math.max(1, Math.round(H*scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const res = removeBgOnCanvas(canvas, levelKey);
    if(!res.ok) return res;
    return { ok:true, dataUrl: canvas.toDataURL('image/png'), removed:res.removed, kept:res.kept };
  }catch(e){
    return { ok:false, reason:'error' };
  }
}

/* 单行去背：保留 originalImage 供「恢复原图」与换档重试 */
async function applyBgToRow(row, strength){
  if(!row || !row.image) return;
  if(!row.originalImage) row.originalImage = row.image;
  const res = await removeBgDataUrl(row.originalImage, strength);
  if(res.ok){
    row.image = res.dataUrl;
    row.bgRemoved = true;
    row.bgStatus = 'ok';
    row.bgRemovedRatio = res.removed;
    row.image = await fitLocal(row.image);
  }else{
    row.image = row.originalImage;
    row.bgRemoved = false;
    row.bgStatus = 'kept';
    row.bgRemovedRatio = res.removed || 0;
  }
}

function describeShotFailure(err){
  let kind = (err && err.kind) || '';
  const msg = (err && err.message) ? String(err.message) : String(err || '');
  if(!kind || kind==='unknown'){
    if(/图片|文件|不是图片|超过 20MB/i.test(msg)) kind = 'image';
    else if(/超时|timeout/i.test(msg)) kind = 'timeout';
  }
  if(kind==='auth' && err && err.status===403) kind = 'forbidden';
  if(kind==='http'){
    if(err && err.status===413) kind = 'image';
    else if(err && err.status===400 && /(尺寸|大小|size|too large|payload)/i.test(msg)) kind = 'image';
  }
  const copy = SHOT_FAIL_COPY[kind] || SHOT_FAIL_COPY.unknown;
  const meta = [];
  if(err && err.kind) meta.push('类型：'+err.kind);
  if(err && err.status) meta.push('HTTP '+err.status);
  const detail = (meta.length ? meta.join(' · ')+'\n' : '') + (msg || '无更多信息');
  return { kind:kind, step:copy.step, title:copy.title, advice:copy.advice, detail:detail };
}

function showShotFailure(err, files, combine, pending){
  const info = describeShotFailure(err);
  recordAIFailure('截图识别', err);
  ui.importFail = {
    kind: info.kind, step: info.step, title: info.title,
    advice: info.advice, detail: info.detail,
    files: Array.from(files||[]).slice(0,8),
    combine: Boolean(combine),
    pending: Array.isArray(pending) ? pending.slice(0,16) : []

  ui.shotFiles = ui.importFail.files.slice();

  ui.importBatch = null;

}

async function handleShotFiles(files){
  const batch = Array.from(files||[]).slice(0, 8);
  if(!batch.length) return;
  if(!isAIConfigured()){
    showShotFailure(
      new AIError('尚未配置可用的视觉模型：请填写 API Key、Base URL，并确认视觉模型名/接入点 ID','config'),
      batch, Boolean(ui.shotCombine), []
    );
    ui.shotCombine = false;
    return;
  }
  if(ui.job){ toast('还有 AI 任务在进行，请先等待或取消'); return; }
  const combine = Boolean(ui.shotCombine);
  let pending = [];
  if(combine && ui.bulk){
    pending = parseLinkLines(ui.bulk.text || '').filter(r=>r.buyUrl);
    ui.bulk = null;
  }
  ui.shotCombine = false;
  const job = beginJob('解析订单截图', `共 ${batch.length} 张，逐张识别`);
  const slowTimer = setTimeout(()=>{
    if(ui.job===job && !job.cancelled) updateJob('解析订单截图', '仍在处理中，长图识别较慢…');
  }, 10000);
  const rows = [];
  let failed = 0;
  let truncated = false;
  let lastError = '';
  let lastErrObj = null;
  for(let i=0;i<batch.length;i++){
    if(job.cancelled) break;
    updateJob('解析订单截图', `第 ${i+1}/${batch.length} 张 · 压缩并识别`);
    let processed;
    try{
      processed = await processShotFile(batch[i]);
    }catch(err){
      failed++;
      lastError = (err && err.message) ? err.message : '图片读取失败';
      lastErrObj = err;
      continue;
    }
    try{
      const parsed = await parseShotsWithAI(processed.aiUrl, job.controller.signal);
      if(parsed && parsed.truncated) truncated = true;
      (parsed.items || []).forEach(item=>{
        rows.push(buildShotRow(item, processed, i+1));
      });
    }catch(err){
      if(job.cancelled || (err && err.kind==='cancelled')) break;
      failed++;
      lastError = friendlyAIError(err);
      lastErrObj = err;
    }
  }
  if(ui.bg.enabled && rows.length){
    for(let i=0;i<rows.length;i++){
      if(job.cancelled) break;
      if(rows[i].oversize) continue;   // 框选过大已退回原图，不再对整图去背
      updateJob('去除背景', `第 ${i+1}/${rows.length} 件 · 提取衣物主体`);
      await applyBgToRow(rows[i], ui.bg.strength);
    }
  }
  endJob(job);
  clearTimeout(slowTimer);
  if(job.cancelled && !rows.length){ toast('已取消识别'); return; }
  if(!rows.length){
    // 不再静默转手动：先展示失败说明，保留截图供重试
    const failErr = lastErrObj || new AIError(lastError || '模型没有识别到商品','empty');
    showShotFailure(failErr, batch, combine, pending);
    return;
  }
  ui.shotFiles = [];
  if(combine && pending.length){
    let bound = 0;
    rows.forEach((r, idx)=>{
      if(idx < pending.length && pending[idx].buyUrl){ r.buyUrl = pending[idx].buyUrl; bound++; }
    });
    if(bound) toast(`已把 ${bound} 条链接按顺序绑定到识别结果`);
  }
  ui.importBatch = { source: (combine && pending.length) ? 'mixed' : 'shots', rows, failed, shotCount: batch.length, truncated };
  render();
  if(failed) setTimeout(()=>toast(`有 ${failed} 张截图未识别成功，已跳过`), 3000);
}

function bindCropDrag(){
  const stage = $('#cropStage'), box = $('#cropBox'), handle = $('#cropHandle');
  if(!stage || !box || !handle || !ui.crop) return;
  const apply = ()=>{
    const c = ui.crop;
    box.style.left = (c.x*100)+'%'; box.style.top = (c.y*100)+'%';
    box.style.width = (c.w*100)+'%'; box.style.height = (c.h*100)+'%';
  };
  let mode = '', start = null;
  const onMove = (e)=>{
    if(!start || !ui.crop) return;
    const dx = (e.clientX - start.mx) / start.sw;
    const dy = (e.clientY - start.my) / start.sh;
    if(mode==='move'){
      ui.crop.x = clamp(start.x + dx, 0, 1 - ui.crop.w);
      ui.crop.y = clamp(start.y + dy, 0, 1 - ui.crop.h);
    }else{
      ui.crop.w = clamp(start.bw + dx, 0.05, 1 - ui.crop.x);
      ui.crop.h = clamp(start.bh + dy, 0.05, 1 - ui.crop.y);
    }
    apply();
  };
  const onUp = ()=>{
    mode = ''; start = null;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  };
  const onDown = (m)=>(e)=>{
    if(!ui.crop) return;
    e.preventDefault(); e.stopPropagation();
    const r = stage.getBoundingClientRect();
    if(!r.width || !r.height) return;
    mode = m;
    start = { mx:e.clientX, my:e.clientY, sw:r.width, sh:r.height, x:ui.crop.x, y:ui.crop.y, bw:ui.crop.w, bh:ui.crop.h };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  };
  handle.addEventListener('pointerdown', onDown('resize'));
  box.addEventListener('pointerdown', onDown('move'));
}

async function cropGarment(gid, box){
  const c = ui.crop;
  const url = await cropShotFromUrl((c && c.url) || '', box);
  if(!url){ toast('这块区域裁不出来，请换个框再试'); return false; }
  const g = getGarment(gid);
  if(!g) return false;
  let next = url;
  let bgRemoved = false;
  if(g.bgRemoved){
    const res = await removeBgDataUrl(url, ui.bg.strength);
    if(res && res.ok){ next = res.dataUrl; bgRemoved = true; }
  }
  if(!/^blob:/.test(next)) next = await fitLocal(next);
  g.image = next;
  g.bgRemoved = bgRemoved;
  g.bgStatus = bgRemoved ? 'ok' : 'off';
  g.__origSrc = url;
  g.__sig = '';
  g.updatedAt = Date.now();
  return true;
}

function cropRow(rowId, box){

    const rows = (ui.importBatch && ui.importBatch.rows) || [];
    const row = rows.find(r=>r.id===rowId);
    if(!row) return false;
    if(!url){ toast('这块区域裁不出来，请换个框再试'); return false; }
    row.image = url;
    row.box = box;
    row.whole = false;
    row.originalImage = url;   // 新裁切结果作为去背基准
    row.bgRemoved = false;
    row.bgStatus = 'off';
    if(ui.bg.enabled) await applyBgToRow(row, ui.bg.strength);
    row.image = await fitLocal(row.image);
    return true;
  });
}

function buildGarmentFromRow(row){
  const cat = CATEGORY_KEYS.includes(row.category) ? row.category : 'pending';
  const colorName = normalizeColorName(row.colorName || '米白');
  const name = String(row.name||'').trim().slice(0,24) || '待补充名称';
  const buy = row.buyUrl ? parseBuyUrl(row.buyUrl) : { ok:false };
  const styles = (row.styles && row.styles.length ? row.styles : [ui.outfitStyle || 'cleanfit'])
    .map(s=>normalizeStyleId(s) || 'cleanfit').slice(0,3);
  const id = uid();
  if(row.originalImage) bgOriginalCache.set(id, row.originalImage);
  return {
    id,
    name,
    category: cat,
    colorName,
    colorHex: getColor(colorName).hex,
    secondaryColor:'',
    styles,
    seasons: normalizeSeasons(row.seasons && row.seasons.length ? row.seasons : (ui.outfitSeason || seasonForDate())),
    formality: clamp(Number(row.formality)||3,1,5),
    material: String(row.material||'').slice(0,20) || '待补充',
    description: String(row.description||'').slice(0,60),
    image: row.image || garmentArt(cat, getColor(colorName).hex),
    __origSrc: ImgStore.mode==='local' ? '' : (row.shotUrl || row.originalImage || row.image || ''),
    bgRemoved: Boolean(row.bgRemoved),
    bgStatus: row.bgStatus || 'off',
    source: row.source || 'import',
    tagSource: row.aiTag ? 'ai' : 'local',
    autoName: false,
    aiPending: false,
    buyUrl: buy.ok ? buy.url : '',
    price: normalizePriceText(row.price),
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

async function confirmImport(){
  const batch = ui.importBatch;
  if(!batch) return;
  const rows = (batch.rows||[]).filter(r=>r.checked);
  if(!rows.length){ toast('请至少勾选一件商品'); return; }
  let added = 0, skipped = 0, noName = 0;
  for(const row of rows){
    const g = buildGarmentFromRow(row);
    if(!String(row.name||'').trim()) noName++;
    if(g.image && !/^blob:/.test(g.image)) g.image = await fitLocal(g.image);
    if(/^data:/.test(g.image) && !canStoreImage(g.image)){ skipped++; continue; }
    state.garments.unshift(g);
    added++;
  }
  if(added) persistOrWarn();
  ui.importBatch = null;
  render();
  if(!added){ toast(skipped ? '本地存储空间不足，未导入；先删几件再试' : '没有可导入的单品'); return; }
  toast(`已导入 ${added} 件${skipped?`，${skipped} 件因空间不足跳过`:''}${noName?`，${noName} 件名称待补充`:''}`);
  if(noName) setTimeout(()=>toast('名称为「待补充名称」的单品，点卡片即可改名'), 3200);
}

async function aiRetagDraft(){
  if(!ui.draft) return;
  if(!isAIConfigured()){
    toast('未配置 AI：请到「我的」选择预设并填写 API Key');
    closeSheet();
    switchTab('me');

  if(ui.job){ toast('还有 AI 任务在进行，请先等待或取消'); return; }
  syncDraftInputs();
  const job = beginJob('AI 重新识别','正在读取这张照片');
  try{
    const aiUrl = await imageToAIDataUrl(ui.draft.image);

    endJob(job);

    endJob(job);
    if(err && err.kind==='cancelled') toast('已取消识别');

  }
}

document.addEventListener('click', function(e){

    switchTab(tabEl.dataset.tab);

  }
  const el = e.target.closest('[data-action]');

    if(e.target.closest('.sheet')) return;

    if(ui.importFail){ ui.importFail = null; renderModal(); return; }
    if(ui.importBatch){ ui.importBatch = null; render(); return; }
    closeSheet();
    return;
  }

  switch(action){
    case 'openSettings':
      switchTab('me');
      setTimeout(()=>{
        const card = $('#aiSettings');
        if(card) card.scrollIntoView({behavior:'smooth',block:'start'});
      },120);
      break;
    case 'showGuide': ui.onbStep = 0; renderOnboarding(true); break;

      const input = $('#wardrobeInput');
      if(input) input.click();
      break;
    }
    case 'addRefs': {
      const input = $('#refInput');
      if(input) input.click();
      break;
    }
    case 'goWardrobe': switchTab('wardrobe'); break;
    case 'goOutfit':
      ui.autoGenTried = true;
      switchTab('outfit');
      if(!ui.outfits.length) generateOutfits();
      break;
    case 'filterCat':
      ui.filterCat = el.dataset.cat || 'all';
      render();
      break;
    case 'editGarment': openGarmentSheet(el.dataset.id); break;
    case 'toggleBgRemove':
      ui.bg.enabled = Boolean(el.checked);
      reprocessImportBg();
      break;
    case 'bgRestoreAll': {
      const b = ui.importBatch;
      ((b && b.rows) || []).forEach(r=>{
        if(!r.originalImage) return;
        r.image = r.originalImage;
        r.bgRemoved = false;
        r.bgStatus = 'off';
      });
      renderModal();
      toast('已恢复原图');
      break;
    }
    case 'draftBgToggle':
      if(el.checked) applyBgToDraft();
      else restoreDraftBg();
      break;
    case 'draftBgRestore': restoreDraftBg(); break;
    case 'deleteGarment': deleteGarmentById(el.dataset.id); break;
    case 'saveGarment': saveGarmentDraft(); break;
    case 'closeSheet': closeSheet(); break;
    case 'deleteGarmentSheet': deleteGarmentBySheet(); break;
    case 'draftCategory':
      syncDraftInputs();
      ui.draft.category = normalizeCategory(el.dataset.cat);
      renderModal();
      break;
    case 'draftColor':
      syncDraftInputs();
      ui.draft.colorName = normalizeColorName(el.dataset.color);
      renderModal();
      break;
    case 'draftStyle': {
      syncDraftInputs();
      const id = el.dataset.style;
      const arr = ui.draft.styles || [];
      if(arr.includes(id)) ui.draft.styles = arr.filter(x=>x!==id);
      else if(arr.length>=3){ toast('最多选 3 个风格'); return; }
      else ui.draft.styles = arr.concat(id);
      renderModal();
      break;
    }
    case 'draftSeason': {
      syncDraftInputs();
      const season = el.dataset.season;
      const arr = ui.draft.seasons || [];
      ui.draft.seasons = arr.includes(season) ? arr.filter(x=>x!==season) : arr.concat(season);
