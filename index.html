.pwa-install[hidden]{display:none}

  .icon-btn.xs{min-width:38px;min-height:38px}

<style>
:root{
  --bg:#f3eee4;
  --paper:#fffdf8;
  --paper-2:#faf6ee;
  --ink:#211f1b;
  --ink-2:#49453e;
  --muted:#847d70;
  --line:rgba(46,39,29,.11);
  --line-strong:rgba(46,39,29,.18);
  --accent:#a45a38;
  --accent-soft:#ead7c8;
  --olive:#53634d;
  --olive-soft:#dfe4d7;
  --gold:#b18b50;
  --danger:#a34638;
  --shadow:0 14px 36px rgba(62,49,33,.09);
  --shadow-soft:0 6px 18px rgba(62,49,33,.07);
  --radius:22px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font-serif:"Songti SC","STSong","SimSun",Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.72),transparent 34%),
    radial-gradient(circle at 88% 100%,rgba(190,169,136,.18),transparent 36%),
    #e8e1d5;
  color:var(--ink);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
a{color:inherit}
::selection{background:var(--accent-soft)}
.app{
  position:relative;
  width:100%;
  max-width:480px;
  height:100vh;
  height:100dvh;
  margin:0 auto;
  background:
    linear-gradient(180deg,rgba(255,253,248,.42),rgba(243,238,228,0) 210px),
    var(--bg);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
@media (min-width:540px) and (min-height:640px){
  body{display:flex;align-items:center;justify-content:center;padding:20px}
  .app{height:min(920px,calc(100dvh - 40px));border-radius:30px;box-shadow:0 30px 80px rgba(41,33,23,.22);border:1px solid rgba(255,255,255,.46)}
}
.topbar{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:calc(11px + env(safe-area-inset-top,0px)) 18px 10px;
  position:relative;
  z-index:10;
  background:linear-gradient(180deg,rgba(243,238,228,.96),rgba(243,238,228,.84) 66%,rgba(243,238,228,0));
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:36px;height:36px;border-radius:12px;flex:none;
  display:grid;place-items:center;
  background:var(--ink);color:#f8f3e8;
  font-family:var(--font-serif);font-size:19px;letter-spacing:.04em;
  box-shadow:0 6px 16px rgba(33,31,27,.18);
}
.brand-copy{min-width:0}
.brand-copy h1{margin:0;font-size:17px;line-height:1.15;letter-spacing:.03em;font-weight:700;white-space:nowrap}
.brand-copy p{margin:3px 0 0;font-size:9px;letter-spacing:.18em;color:var(--muted);white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.mode-pill{
  display:inline-flex;align-items:center;gap:5px;
  height:30px;padding:0 10px;border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,253,248,.72);
  color:var(--ink-2);font-size:10px;font-weight:600;white-space:nowrap;
}
.mode-pill .status-dot{width:6px;height:6px;border-radius:50%;background:var(--olive);box-shadow:0 0 0 3px rgba(83,99,77,.01)}
.mode-pill.ai .status-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(164,90,56,.08)}
.mode-pill:active{transform:scale(.97)}
.help-btn{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;
  border:1px solid var(--line);
  background:rgba(255,253,248,.72);
  color:var(--ink-2);font-family:var(--font-serif);font-size:15px;
}
.main{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:0 18px calc(26px + var(--safe-bottom));
  scrollbar-width:none;
}
.main::-webkit-scrollbar{display:none}
.tabbar{
  flex:none;display:grid;grid-template-columns:repeat(4,1fr);
  align-items:center;padding:8px 8px calc(7px + var(--safe-bottom));
  background:rgba(255,253,248,.92);
  border-top:1px solid rgba(46,39,29,.08);
  box-shadow:0 -10px 26px rgba(62,49,33,.05);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  position:relative;z-index:20;
}
.tab-item{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:48px;border-radius:16px;color:var(--muted);font-size:11px;font-weight:500;
  transition:color .18s ease,background .18s ease;
}
.tab-item svg{width:21px;height:21px;stroke-width:1.75}
.tab-item.active{color:var(--ink)}
.tab-item.active .tab-ink{position:absolute;top:2px;width:26px;height:3px;border-radius:99px;background:var(--accent)}
.tab-item:active{background:var(--paper-2)}
.hero{
  position:relative;overflow:hidden;
  margin-top:6px;padding:24px 22px 19px;
  border-radius:26px;
  background:
    radial-gradient(circle at 92% 14%,rgba(255,255,255,.5),transparent 30%),
    linear-gradient(145deg,#e8dac6 0%,#decdb4 60%,#d6c2a6 100%);
  box-shadow:var(--shadow-soft);
  color:#2a241c;
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:150px;height:150px;right:-44px;bottom:-62px;border:1px solid rgba(255,255,255,.46);background:rgba(255,255,255,.14)}
.hero::after{width:84px;height:84px;right:18px;top:-28px;border:1px solid rgba(255,255,255,.32)}
.hero .eyebrow{color:rgba(61,48,31,.62)}
.hero h1{margin:11px 0 0;font-size:31px;line-height:1.2;letter-spacing:-.02em;font-weight:700;max-width:320px;position:relative;z-index:1}
.hero h1 em{font-style:normal;font-family:var(--font-serif);font-weight:500;color:var(--accent)}
.hero p{margin:9px 0 0;max-width:300px;font-size:12.5px;line-height:1.65;color:rgba(46,38,27,.68);position:relative;z-index:1}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.hero-note{display:flex;align-items:center;gap:6px;margin-top:16px;font-size:10.5px;color:rgba(46,38,27,.56);position:relative;z-index:1}
.hero-note .line{width:18px;height:1px;background:rgba(46,38,27,.35)}
.eyebrow{font-size:9.5px;letter-spacing:.19em;font-weight:700;text-transform:uppercase;color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:42px;padding:0 17px;border-radius:999px;
  font-size:13px;font-weight:650;line-height:1;white-space:nowrap;
  transition:transform .16s ease,background .16s ease,opacity .16s ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#fbf7ef;box-shadow:0 8px 18px rgba(33,31,27,.16)}
.btn-primary:hover{background:#343028}
.btn-accent{background:var(--accent);color:#fff8f0;box-shadow:0 8px 20px rgba(164,90,56,.2)}
.btn-ghost{background:rgba(255,253,248,.7);border:1px solid var(--line);color:var(--ink-2)}
.btn-light{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.6);color:#2a241c}
.btn-block{width:100%}
.btn-sm{min-height:32px;padding:0 12px;font-size:11px;border-radius:999px}
.btn-xs{min-height:27px;padding:0 10px;font-size:10px;border-radius:999px}
.btn-soft{background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2)}
.btn-danger-soft{background:#f6e9e5;border:1px solid rgba(163,70,56,.18);color:var(--danger)}
.btn:disabled{opacity:.5;pointer-events:none}
.icon-btn{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);
}
.icon-btn.xs{width:27px;height:27px;font-size:12px}
.card{
  background:var(--paper);border:1px solid rgba(255,255,255,.64);
  border-radius:var(--radius);box-shadow:var(--shadow-soft);
}
.section{margin-top:24px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-title{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.section-sub{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.55}
.section-link{font-size:11px;color:var(--muted);text-decoration:none}
.stats-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 2px;scrollbar-width:none}
.stats-scroll::-webkit-scrollbar{display:none}
.stat-chip{
  display:flex;align-items:center;gap:8px;flex:none;
  min-height:42px;padding:0 13px;border-radius:14px;
  background:rgba(255,253,248,.78);border:1px solid var(--line);
  color:var(--ink-2);font-size:11px;white-space:nowrap;
}
.stat-chip strong{font-family:var(--font-serif);font-size:19px;line-height:1;font-weight:600;color:var(--ink)}
.stat-chip em{font-style:normal;color:var(--muted)}
.stat-chip.total{background:var(--ink);color:#f8f3e8;border-color:transparent}
.stat-chip.total strong{color:#fff}
.stat-chip.total em{color:rgba(255,255,255,.56)}
.filters{margin-top:16px}
.filter-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:5px;
  min-height:32px;padding:0 12px;border-radius:999px;
  background:rgba(255,253,248,.66);border:1px solid var(--line);
  color:var(--ink-2);font-size:11px;font-weight:500;white-space:nowrap;
}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fffaf1}
.chip .count{font-size:9px;opacity:.6}
.filter-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;font-size:10px;color:var(--muted)}
.mini-select{
  max-width:150px;height:30px;padding:0 27px 0 10px;border-radius:10px;
  border:1px solid var(--line);background:var(--paper-2);
  font-size:10px;color:var(--ink-2);
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 13px,calc(100% - 10px) 13px;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.product-card{
  position:relative;overflow:hidden;border-radius:18px;
  background:var(--paper);border:1px solid rgba(255,255,255,.68);
  box-shadow:0 5px 16px rgba(62,49,33,.055);
  cursor:pointer;
}
.product-media{position:relative;aspect-ratio:1/1.1;overflow:hidden;background:#ebe4d7}
.product-media img{width:100%;height:100%;object-fit:cover}
.product-media::after{
  content:"";position:absolute;inset:auto 0 0;height:46%;
  background:linear-gradient(transparent,rgba(24,21,17,.16));
  pointer-events:none;
}
.product-cat{
  position:absolute;left:9px;top:9px;z-index:1;
  min-height:22px;padding:0 8px;border-radius:999px;
  background:rgba(255,253,248,.9);color:var(--ink-2);
  display:inline-flex;align-items:center;gap:4px;
  font-size:9px;font-weight:600;backdrop-filter:blur(6px);
}
.product-cat .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.product-del{
  position:absolute;right:7px;top:7px;z-index:2;
  width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,253,248,.86);color:#7e7568;
  font-size:13px;line-height:1;backdrop-filter:blur(6px);
}
.product-del:active{background:#fff}
.product-body{padding:10px 11px 12px}
.product-name{margin:0;font-size:12.5px;font-weight:650;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-meta{display:flex;align-items:center;gap:5px;margin-top:6px;color:var(--muted);font-size:9.5px;white-space:nowrap;overflow:hidden}
.color-dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.14);vertical-align:-1px}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-height:39px;overflow:hidden}
.mini-tag{
  max-width:100%;padding:3px 7px;border-radius:6px;background:var(--paper-2);
  border:1px solid rgba(46,39,29,.07);color:var(--ink-2);font-size:8.5px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pending-badge{
  position:absolute;left:9px;bottom:9px;z-index:1;
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 8px;border-radius:999px;background:rgba(33,31,27,.8);
  color:#fff7e9;font-size:8.5px;
}
.spinner{
  width:10px;height:10px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.36);border-top-color:#fff;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{
  padding:46px 24px 40px;text-align:center;
  border:1px dashed var(--line-strong);border-radius:24px;
  background:rgba(255,253,248,.4);
}
.empty-art{width:138px;height:118px;margin:0 auto 14px;opacity:.9}
.empty h3{margin:0;font-size:15px;font-weight:700}
.empty p{margin:8px auto 0;max-width:250px;color:var(--muted);font-size:11.5px;line-height:1.7}
.empty-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.filter-empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.7}
.style-hero{
  margin-top:6px;padding:22px 21px 20px;border-radius:26px;
  background:
    radial-gradient(circle at 86% 22%,rgba(255,255,255,.38),transparent 30%),
    linear-gradient(145deg,#cbd2c3,#b7c2ae 66%,#aebaa5);
  color:#293027;box-shadow:var(--shadow-soft);position:relative;overflow:hidden;
}
.style-hero h1{margin:10px 0 0;font-size:29px;line-height:1.22;letter-spacing:-.02em}
.style-hero p{margin:9px 0 0;font-size:12px;line-height:1.65;color:rgba(41,48,39,.68);max-width:300px}
.style-hero .eyebrow{color:rgba(41,48,39,.56)}
.ref-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.ref-card{
  background:var(--paper);border-radius:18px;overflow:hidden;
  border:1px solid rgba(255,255,255,.64);box-shadow:var(--shadow-soft);
  position:relative;
}
.ref-media{position:relative;aspect-ratio:4/5;background:#eae3d7;overflow:hidden}
.ref-media img{width:100%;height:100%;object-fit:cover}
.ref-del{position:absolute;right:7px;top:7px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,253,248,.9);font-size:12px;color:#756e62}
.ref-ai-badge{position:absolute;left:8px;top:8px;padding:4px 7px;border-radius:999px;background:rgba(33,31,27,.76);color:#fff8ec;font-size:8px;letter-spacing:.06em}
.ref-body{padding:9px 10px 10px}
.ref-select{width:100%;height:29px;border-radius:9px;border:1px solid var(--line);background:var(--paper-2);padding:0 7px;font-size:10px;color:var(--ink-2)}
.ref-profile{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.ref-profile .mini-tag{background:#edf0e7;border-color:rgba(83,99,77,.13)}
.ref-palette{display:flex;align-items:center;gap:4px;margin-top:7px}
.swatch{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.ref-actions{display:flex;gap:5px;margin-top:8px}
.pref-btn{
  flex:1;min-height:28px;border-radius:999px;border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  background:var(--paper-2);font-size:9.5px;color:var(--ink-2);
}
.pref-btn.on.like{background:#f0e5d5;border-color:rgba(164,90,56,.24);color:#8e4e31}
.pref-btn.on.dislike{background:#ece6df;border-color:rgba(94,83,69,.2);color:#61584c}
.ref-upload{
  min-height:195px;border:1px dashed var(--line-strong);border-radius:18px;
  background:rgba(255,253,248,.38);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--muted);text-align:center;padding:16px;
}
.ref-upload .plus{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-size:18px;color:var(--ink-2)}
.ref-upload strong{font-size:12px;color:var(--ink-2);font-weight:650}
.ref-upload span{font-size:9.5px;line-height:1.5;max-width:130px}
.style-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.style-card{
  position:relative;padding:13px 12px 11px;border-radius:17px;
  background:var(--paper);border:1px solid rgba(255,255,255,.7);
  box-shadow:0 4px 14px rgba(62,49,33,.055);overflow:hidden;
}
.style-card::before{content:"";position:absolute;width:76px;height:76px;border-radius:50%;right:-31px;top:-32px;background:rgba(164,90,56,.045)}
.style-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;position:relative;z-index:1}
.style-name{margin:0;font-size:13.5px;font-weight:700;line-height:1.25;letter-spacing:.01em}
.style-en{margin-top:2px;font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.style-desc{margin:8px 0 0;min-height:43px;font-size:9.5px;line-height:1.5;color:var(--ink-2);opacity:.82}
.style-palette{display:flex;gap:4px;margin-top:8px;align-items:center}
.style-items{margin-top:8px;font-size:8.5px;line-height:1.5;color:var(--muted);height:25px;overflow:hidden}
.style-actions{display:flex;gap:4px;margin-top:8px}
.style-use{margin-top:7px;width:100%;min-height:27px;border-radius:8px;background:var(--paper-2);border:1px solid var(--line);font-size:9px;color:var(--ink-2)}
.style-use:active{background:#f2ebdf}
.pref-summary{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pref-summary .mini-tag{background:rgba(255,253,248,.55);border-color:rgba(46,39,29,.1);font-size:9px;padding:4px 8px}
.outfit-hero{
  margin-top:6px;padding:22px 21px 18px;border-radius:26px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 88% 12%,rgba(255,255,255,.3),transparent 32%),
    linear-gradient(145deg,#292622,#3d342b 72%,#4b3b2f);
  color:#fbf5e9;box-shadow:0 16px 34px rgba(37,30,23,.18);

.copy-list-btn{

.bulk-text{

.notice-box{

.fail-keep{margin:12px 0 0;font-size:8.5px;line-height:1.55;color:var(--olive)}

.diag-box summary{font-size:9px;color:var(--muted);cursor:pointer;list-style:none}

.diag-box summary::before{content:"▸ ";color:var(--muted)}
.diag-box[open] summary::before{content:"▾ "}
.diag-box pre{
  margin:8px 0 0;padding:9px 10px;border-radius:9px;background:var(--paper-2);

}

.imp-check{flex:none;padding-top:2px}
.imp-check input{

}
.imp-check input:checked{background:var(--ink);border-color:var(--ink)}

.imp-thumb{

}

.imp-recro{

.cap-tip code{font-size:9.5px;background:rgba(46,39,29,.06);padding:1px 4px;border-radius:4px}
.bg-tools{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;

  background:var(--paper-2);border:1px solid var(--line);

  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}

}
.crop-stage img{width:100%;height:auto;display:block;pointer-events:none;opacity:.72}
.crop-box{
  position:absolute;border:2px solid #fff;border-radius:4px;
  box-shadow:0 0 0 9999px rgba(20,18,15,.45);
  cursor:move;touch-action:none;
}
.crop-handle{
  position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;border-radius:4px;
  background:#fff;border:2px solid var(--accent);cursor:nwse-resize;touch-action:none;
}
.hidden{display:none!important}

  .product-grid{gap:9px}

function parseHttpUrl(raw){
  const text = String(raw||'').trim();
  if(!text) return null;
  if(!/^https?:\/\//i.test(text)) return null;
  try{ return new URL(text); }catch(e){ return null; }
}
function shopPlatform(url){
  const u = typeof url==='string' ? parseHttpUrl(url) : url;
  if(!u) return SHOP_PLATFORMS[SHOP_PLATFORMS.length-1];
  const host = u.hostname.toLowerCase();
  for(const p of SHOP_PLATFORMS){
    for(const d of p.domains){
      if(host===d || host.endsWith('.'+d)) return p;
    }
  }
  return SHOP_PLATFORMS[SHOP_PLATFORMS.length-1];
}
function shopIdOf(platform, u){
  const href = u.href;
  const q = u.searchParams;
  const pick = (keys)=>{ for(const k of keys){ const v = q.get(k); if(v && /^\d{3,}$/.test(v)) return v; } return ''; };
  if(platform.id==='taobao'){
    const id = pick(['id','itemId','item_id']);
    if(id) return { id, unknown:false };
    const m = href.match(/\/i(\d{6,})\.htm/);
    return m ? { id:m[1], unknown:false } : { id:'', unknown:true, note:'短链 / 未带 id 参数' };
  }
  if(platform.id==='jd'){
    const m = href.match(/\/product\/(\d{4,})/) || href.match(/item\.jd\.com\/(\d{4,})/) || href.match(/\/goods\/(\d{4,})/);
    if(m) return { id:m[1], unknown:false };
    const sku = pick(['sku','skuId','wareId']);
    return sku ? { id:sku, unknown:false } : { id:'', unknown:true, note:'短链 / 未识别 SKU' };
  }
  if(platform.id==='pdd'){
    const gid = pick(['goods_id','goodsId','goodsID']);
    if(gid) return { id:gid, unknown:false };
    const m = href.match(/\/goods(?:_detail)?\/(\d{4,})/);
    return m ? { id:m[1], unknown:false } : { id:'', unknown:true, note:'短链 / 未识别 goods_id' };
  }
  if(platform.id==='douyin'){
    const gid = pick(['goods_id','id']);
    if(gid) return { id:gid, unknown:false };
    return { id:'', unknown:true, note:'短链 / 未知 ID' };
  }
  if(platform.id==='xhs') return { id:'', unknown:true, note:'笔记链接 / 无商品 ID' };
  return { id:'', unknown:true, note:'未识别商品 ID' };
}
function parseBuyUrl(raw){
  const text = String(raw||'').trim();
  if(!text){
    return { ok:false, error:'链接为空', url:'', platform:null, platformLabel:'', itemId:'', unknown:true, note:'' };
  }
  if(!/^https?:\/\//i.test(text)){
    return { ok:false, error:'链接需以 http:// 或 https:// 开头', url:text, platform:null, platformLabel:'', itemId:'', unknown:true, note:'' };
  }
  const u = parseHttpUrl(text);
  if(!u){
    return { ok:false, error:'链接格式不正确，请检查是否粘完整', url:text, platform:null, platformLabel:'', itemId:'', unknown:true, note:'' };
  }
  const platform = shopPlatform(u);
  const info = shopIdOf(platform, u);
  return {
    ok:true, error:'', url:u.href, platform:platform.id, platformLabel:platform.label,
    color:platform.color, itemId:info.id, unknown:info.unknown, note:info.note||''
  };
}
function shopSearchKeyword(g){
  const parts = [];
  const name = String(g&&g.name||'').trim();
  if(name) parts.push(name);
  const color = String(g&&g.colorName||'').trim();
  if(color && !name.includes(color)) parts.push(color);
  const cat = g ? categoryLabel(g.category) : '';
  if(cat && !name.includes(cat)) parts.push(cat);
  return parts.join(' ').trim() || '通勤 基础款';
}
function shopSearchLinks(g){
  const q = shopSearchKeyword(g);
  return SHOP_SEARCH_ENGINES.map(e=>({ id:e.id, label:e.label, url:e.build(q) }));
}
function shopPlatformLabelOf(url){
  const p = parseBuyUrl(url);
  return p.ok ? p.platformLabel : '';
}

  return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
}

function normalizeStyleId(value){
  if(value==null) return null;
  let s = String(value).trim().toLowerCase().replace(/风格|风$/g,'');
  if(STYLE_DEFS.some(d=>d.id===s)) return s;
  for(const k of Object.keys(VISION_STYLE_ALIASES)){
    if(s.includes(k.toLowerCase())) return VISION_STYLE_ALIASES[k];
  }
  if(/clean\s*fit/.test(s)) return 'cleanfit';
  for(const d of STYLE_DEFS){ if(s.includes(d.name.toLowerCase())) return d.id; }
  return null;
}
function normalizeCategory(value){
  const s = String(value||'').trim().toLowerCase();
  if(/^pending$|待分类|未分类/.test(s)) return 'pending';
  const map = {
    '上装':'top','top':'top','上衣':'top','衬衫':'top','针织':'top','t恤':'top','topwear':'top',
    '下装':'bottom','bottom':'bottom','裤':'bottom','裤子':'bottom','裙':'bottom','半裙':'bottom','skirt':'bottom','pants':'bottom',
    '外套':'outer','outer':'outer','outerwear':'outer','夹克':'outer','大衣':'outer','风衣':'outer',
    '连身':'dress','dress':'dress','连衣裙':'dress','连体':'dress','onepiece':'dress',

    '配饰':'accessory','accessory':'accessory','饰品':'accessory','帽子':'accessory','围巾':'accessory'

  if(map[s]) return map[s];

function normalizeSeasons(value){
  let arr = Array.isArray(value) ? value : [value];
  arr = arr.map(v=>String(v||'').trim()).filter(Boolean);
  const result = new Set();
  arr.forEach(v=>{
    if(/春秋|春|秋/.test(v)) result.add('春秋');
    if(/夏|summer/i.test(v)) result.add('夏');
    if(/冬|winter/i.test(v)) result.add('冬');
    if(/四季|all/i.test(v)){ result.add('春秋'); result.add('夏'); result.add('冬'); }
  });
  return result.size ? Array.from(result) : [seasonForDate()];
}

function loadImage(src){
  return new Promise(resolve=>{
    const img = new Image();
    let done = false;
    const finish = val=>{ if(!done){ done=true; resolve(val); } };
    img.onload = ()=>finish(img);
    img.onerror = ()=>finish(null);
    img.src = src;
    setTimeout(()=>finish(img), 2200);
  });
}

function sampleAverageColor(img){
  try{
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d',{willReadFrequently:true});
    c.width = 48; c.height = 48;
    const nw = img.naturalWidth || img.width || 1;
    const nh = img.naturalHeight || img.height || 1;
    const side = Math.min(nw,nh);
    ctx.drawImage(img,(nw-side)/2,(nh-side)/2,side,side,0,0,48,48);
    const data = ctx.getImageData(0,0,48,48).data;
    let r=0,g=0,b=0,count=0;
    for(let y=5;y<43;y+=1){
      for(let x=5;x<43;x+=1){
        const i=(y*48+x)*4;
        if(data[i+3]<96) continue;
        r+=data[i]; g+=data[i+1]; b+=data[i+2]; count++;
      }
    }
    if(!count) return '#e7ded0';
    return rgbToHex(r/count,g/count,b/count);
  }catch(e){
    return '#e7ded0';
  }
}

function renderImageToDataUrl(img, edge, quality){
  const nw = img.naturalWidth || img.width;
  const nh = img.naturalHeight || img.height;
  const scale = Math.min(1, edge/Math.max(nw,nh));
  const w = Math.max(1,Math.round(nw*scale));
  const h = Math.max(1,Math.round(nh*scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fbf8f1';
  ctx.fillRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',quality);
}

async function processImageFile(file){
  if(!file || !file.type || !/^image\//.test(file.type)) throw new Error('不是有效的图片文件');
  if(file.size > 20*1024*1024) throw new Error('单张图片超过 20MB，请先压缩后再上传');
  const objectUrl = URL.createObjectURL(file);
  try{
    const img = await loadImage(objectUrl);
    if(!img || !img.naturalWidth) throw new Error('图片读取失败，请换一张试试');
    const sampledHex = sampleAverageColor(img);
    const colorName = nearestPaletteColor(sampledHex);
    let storeUrl = renderImageToDataUrl(img, ImgStore.mode==='local' ? CONFIG.LIMITS.localFullEdge : CONFIG.LIMITS.imageStoreEdge, CONFIG.LIMITS.imageStoreQuality);
    if(storeUrl.length > CONFIG.LIMITS.perImageBudget){
      storeUrl = renderImageToDataUrl(img, 520, 0.62);
    }
    if(storeUrl.length > CONFIG.LIMITS.perImageBudget){
      storeUrl = renderImageToDataUrl(img, 420, 0.54);
    }
    if(storeUrl.length > CONFIG.LIMITS.perImageBudget) throw new Error('图片压缩后仍然过大，请换一张更小的图片');
    const aiUrl = renderImageToDataUrl(img, CONFIG.LIMITS.aiImageEdge, CONFIG.LIMITS.aiImageQuality);
    return { storeUrl, aiUrl, colorName, sampledHex };
  } finally {
    URL.revokeObjectURL(objectUrl);
  }
}

async function imageToAIDataUrl(dataUrl){
  const img = await loadImage(dataUrl);
  if(!img || !img.naturalWidth) throw new Error('图片读取失败');
  return renderImageToDataUrl(img, CONFIG.LIMITS.aiImageEdge, CONFIG.LIMITS.aiImageQuality);
}

/* =============================================================================
   存储层：IndexedDB（图片存 Blob）+ localStorage 降级（极限压缩 + LRU）
   -----------------------------------------------------------------------------
   · idb 模式：元数据写 localStorage(v2) 作为同步启动镜像，图片按 thumb/full/orig
     三级存进 IndexedDB，不占 localStorage 配额。
   · local 模式（file:// 下 IndexedDB 不可用）：图片内联 dataURL，按极限尺寸压缩，
     超过件数上限或预算时按最近使用淘汰。
   ============================================================================= */
const IMG_DB = { name: CONFIG.DB_NAME, ver: 1, store: 'assets', meta: 'meta' };

const ImgStore = {
  mode: 'local',
  db: null,
  ready: false,
  probeReason: ''
};

function idbOpenOnce(timeoutMs){
  return new Promise(resolve=>{
    let done = false;
    const finish = (v)=>{ if(done) return; done = true; resolve(v); };
    let req;
    try{ req = indexedDB.open(IMG_DB.name, IMG_DB.ver); }
    catch(e){ finish({ok:false, reason:(e&&e.name)||'throw'}); return; }
    if(!req){ finish({ok:false, reason:'no-request'}); return; }
    req.onupgradeneeded = ()=>{
      try{
        const db = req.result;
        if(!db.objectStoreNames.contains(IMG_DB.store)) db.createObjectStore(IMG_DB.store);
        if(!db.objectStoreNames.contains(IMG_DB.meta)) db.createObjectStore(IMG_DB.meta);
      }catch(e){}
    };
    req.onsuccess = ()=>{ finish({ok:true, db:req.result}); };
    req.onerror = ()=>finish({ok:false, reason:(req.error&&req.error.name)||'error'});
    req.onblocked = ()=>finish({ok:false, reason:'blocked'});
    setTimeout(()=>finish({ok:false, reason:'timeout'}), timeoutMs||1200);
  });
}

ImgStore.init = async function(){
  const res = await idbOpenOnce(1200);
  if(res.ok){ this.mode = 'idb'; this.db = res.db; }
  else { this.mode = 'local'; this.db = null; this.probeReason = res.reason || 'unavailable'; }
  this.ready = true;
  return this.mode;
};

function assetKey(owner, id, kind){ return owner+':'+id+':'+kind; }

ImgStore.putAsset = function(owner, id, kind, blob){
  return new Promise((resolve,reject)=>{
    if(!this.db) return reject(new Error('no-db'));
    let tx;
    try{ tx = this.db.transaction(IMG_DB.store,'readwrite'); }catch(e){ return reject(e); }
    try{ tx.objectStore(IMG_DB.store).put(blob, assetKey(owner,id,kind)); }catch(e){ return reject(e); }
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error||new Error('tx'));
    tx.onabort = ()=>reject(tx.error||new Error('abort'));
  });
};
ImgStore.getAsset = function(owner, id, kind){
  return new Promise(resolve=>{
    if(!this.db) return resolve(null);
    let tx;
    try{ tx = this.db.transaction(IMG_DB.store,'readonly'); }catch(e){ return resolve(null); }
    let req;
    try{ req = tx.objectStore(IMG_DB.store).get(assetKey(owner,id,kind)); }catch(e){ return resolve(null); }
    req.onsuccess = ()=>resolve(req.result||null);
    req.onerror = ()=>resolve(null);
  });
};
ImgStore.delAsset = function(owner, id, kind){
  return new Promise(resolve=>{
    if(!this.db) return resolve(false);
    let tx;
    try{ tx = this.db.transaction(IMG_DB.store,'readwrite'); }catch(e){ return resolve(false); }
    try{ tx.objectStore(IMG_DB.store).delete(assetKey(owner,id,kind)); }catch(e){ return resolve(false); }
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>resolve(false);
  });
};
ImgStore.putMeta = function(json){
  return new Promise(resolve=>{
    if(!this.db) return resolve(false);
    let tx;
    try{ tx = this.db.transaction(IMG_DB.meta,'readwrite'); }catch(e){ return resolve(false); }
    try{ tx.objectStore(IMG_DB.meta).put(json,'state'); }catch(e){ return resolve(false); }
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>resolve(false);
  });
};
ImgStore.clearAll = async function(){
  if(!this.db) return;
  try{
    const tx = this.db.transaction([IMG_DB.store, IMG_DB.meta],'readwrite');
    tx.objectStore(IMG_DB.store).clear();
    tx.objectStore(IMG_DB.meta).clear();
  }catch(e){}
};

/* 用 canvas 重编码：保留 alpha，输出 WebP（不支持时回退 JPEG） */
function packBlob(dataUrl, edge, quality){
  return new Promise(resolve=>{
    if(!dataUrl || !/^data:image\//.test(dataUrl)) return resolve(null);
    const img = new Image();
    img.onload = ()=>{
      try{
        const nw = img.naturalWidth || img.width;
        const nh = img.naturalHeight || img.height;
        const sc = Math.min(1, edge/Math.max(nw,nh));
        const w = Math.max(1,Math.round(nw*sc));
        const h = Math.max(1,Math.round(nh*sc));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        if(!c.toBlob) return resolve(null);
        c.toBlob(b=>{
          if(b) return resolve(b);
          c.toBlob(b2=>resolve(b2||null), 'image/jpeg', quality);
        }, 'image/webp', quality);
      }catch(e){ resolve(null); }
    };
    img.onerror = ()=>resolve(null);
    img.src = dataUrl;
  });
}

function packDataUrl(dataUrl, edge, quality){
  return new Promise(resolve=>{
    if(!dataUrl || !/^data:image\//.test(dataUrl)) return resolve(dataUrl);
    const img = new Image();
    img.onload = ()=>{
      try{
        const nw = img.naturalWidth || img.width;
        const nh = img.naturalHeight || img.height;
        const sc = Math.min(1, edge/Math.max(nw,nh));
        const w = Math.max(1,Math.round(nw*sc));
        const h = Math.max(1,Math.round(nh*sc));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        let out = c.toDataURL('image/webp', quality);
        if(!/^data:image\/webp/.test(out)) out = c.toDataURL('image/jpeg', quality);
        resolve(out.length < dataUrl.length ? out : dataUrl);
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}

/* 降级模式：把任意图片压到极限尺寸；idb 模式原样返回 */
async function fitLocal(dataUrl){
  if(!dataUrl || typeof dataUrl!=='string') return dataUrl;
  if(/^blob:/.test(dataUrl) || !/^data:image\//.test(dataUrl)) return dataUrl;
  if(ImgStore.mode !== 'local') return dataUrl;
  return packDataUrl(dataUrl, CONFIG.LIMITS.localFullEdge, CONFIG.LIMITS.localFullQuality);
}

function buildMetaJson(){
  const assets = {};
  [...state.garments, ...state.refs].forEach(it=>{ if(it.asset) assets[it.id] = it.asset; });
  const body = JSON.parse(JSON.stringify(state, (k,v)=>{
    if(k==='image' || k==='thumb' || k==='origUrl' || k==='__origSrc' || k==='__sig') return undefined;
    return v;
  }));
  body.v = 2;
  body.assets = assets;
  return JSON.stringify(body);
}

function assetItemList(){
  return state.garments.map(it=>({owner:'g', it}))
    .concat(state.refs.map(it=>({owner:'r', it})));
}

let assetChain = Promise.resolve();
let assetFailures = 0;

function queueAssetSync(){
  if(ImgStore.mode === 'idb' && ImgStore.db){
    assetChain = assetChain.then(()=>syncAssets()).catch(()=>{});
  }else if(ImgStore.mode === 'local'){
    assetChain = assetChain.then(()=>localThumbs()).catch(()=>{});
  }
  return assetChain;
}

/* 降级模式：为列表生成极小缩略图，避免首屏加载大图 */
async function localThumbs(){
  if(ImgStore.mode !== 'local') return;
  let changed = false;
  for(const {it} of assetItemList()){
    const src = it.image;
    if(!src || /^blob:/.test(src) || !/^data:image\//.test(src)) continue;
    if(it.thumb && it.__thumbSig === src.length) continue;
    const t = await packDataUrl(src, CONFIG.LIMITS.localThumbEdge, CONFIG.LIMITS.localThumbQuality);
    if(t && t !== src){ it.thumb = t; it.__thumbSig = src.length; changed = true; }
  }
  if(changed){
    try{ localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
}

async function syncAssets(){
  if(ImgStore.mode !== 'idb' || !ImgStore.db) return;
  for(const {owner, it} of assetItemList()){
    const src = it.image;
    if(!src || /^blob:/.test(src) || !/^data:image\//.test(src)) continue;
    const orig = it.__origSrc || '';
    const sig = src.length+':'+src.slice(-24)+'|'+(orig?orig.length:0);
    if(it.__sig === sig) continue;
    const thumb = await packBlob(src, CONFIG.LIMITS.thumbEdge, CONFIG.LIMITS.thumbQuality);
    const full  = await packBlob(src, CONFIG.LIMITS.fullEdge, CONFIG.LIMITS.fullQuality);
    const origBlob = orig && orig!==src ? await packBlob(orig, CONFIG.LIMITS.origEdge, CONFIG.LIMITS.origQuality) : null;
    try{
      if(thumb) await ImgStore.putAsset(owner, it.id, 'thumb', thumb);
      if(full) await ImgStore.putAsset(owner, it.id, 'full', full);
      if(origBlob) await ImgStore.putAsset(owner, it.id, 'orig', origBlob);
      else await ImgStore.delAsset(owner, it.id, 'orig');
    }catch(e){
      assetFailures++;
      storageOK = false;
      throw e;
    }
    it.asset = { thumb: thumb?thumb.size:0, full: full?full.size:0, orig: origBlob?origBlob.size:0 };
    it.__sig = sig;
    if(full && !/^blob:/.test(it.image)) it.image = URL.createObjectURL(full);
    if(thumb) it.thumb = URL.createObjectURL(thumb);
    if(origBlob) it.origUrl = URL.createObjectURL(origBlob);
  }
  try{ localStorage.setItem(CONFIG.STORAGE_V2, buildMetaJson()); }catch(e){}
  await ImgStore.putMeta(buildMetaJson());
}

/* 旧 localStorage 数据 → IndexedDB；成功后清理旧键，失败保留原数据 */
async function migrateLegacyToIdb(){
  if(ImgStore.mode !== 'idb') return {ok:false, skipped:true};
  let raw = null;
  try{ raw = localStorage.getItem(CONFIG.STORAGE_KEY); }catch(e){ return {ok:false, skipped:true}; }
  if(!raw) return {ok:true, count:0};
  try{
    const legacy = normalizeState(JSON.parse(raw));
    const ids = new Set(state.garments.map(g=>g.id));
    let count = 0;
    legacy.garments.forEach(g=>{ if(!ids.has(g.id)){ state.garments.push(g); count++; } });
    const rids = new Set(state.refs.map(r=>r.id));
    legacy.refs.forEach(r=>{ if(!rids.has(r.id)) state.refs.push(r); });
    if(!state.favorites.length && legacy.favorites.length) state.favorites = legacy.favorites;
    await syncAssets();
    const json = buildMetaJson();
    localStorage.setItem(CONFIG.STORAGE_V2, json);
    await ImgStore.putMeta(json);
    localStorage.removeItem(CONFIG.STORAGE_KEY);
    if(count) toast(`已迁移 ${count} 件旧衣物到 IndexedDB 存储`);
    return {ok:true, count};
  }catch(e){
    toast('旧数据迁移失败，已保留原数据未删除，请检查浏览器存储权限');
    return {ok:false, error:String((e&&e.message)||e)};
  }
}

/* 刷新后从 IndexedDB 取回三级图，回填为可显示的 blob URL */
async function hydrateAssets(){
  if(ImgStore.mode !== 'idb') return 0;
  let loaded = 0;
  for(const {owner, it} of assetItemList()){
    if(!it.asset) continue;
    const thumb = await ImgStore.getAsset(owner, it.id, 'thumb');
    const full = await ImgStore.getAsset(owner, it.id, 'full');
    const orig = await ImgStore.getAsset(owner, it.id, 'orig');
    if(thumb) it.thumb = URL.createObjectURL(thumb);
    if(full){ it.image = URL.createObjectURL(full); loaded++; }
    if(orig) it.origUrl = URL.createObjectURL(orig);
    it.__sig = 'hydrated';
    if(!it.image && owner==='g') it.image = garmentArt(it.category||'top', it.colorHex||'#e7ded0');
  }
  return loaded;
}

/* 降级模式：把存量旧图压到极限尺寸 */
async function localizeExisting(){
  if(ImgStore.mode !== 'local') return 0;
  let n = 0;
  for(const {it} of assetItemList()){
    if(!it.image || /^blob:/.test(it.image)) continue;
    if(it.image.length < 90000) continue;
    it.image = await fitLocal(it.image);
    n++;
  }
  return n;
}

function dropOldestGarment(){
  if(!state.garments.length) return false;
  let idx = 0, oldest = Infinity;
  state.garments.forEach((g,i)=>{
    const t = g.updatedAt || g.createdAt || 0;
    if(t < oldest){ oldest = t; idx = i; }
  });
  const g = state.garments[idx];
  state.garments.splice(idx,1);
  return g;
}
function enforceLocalBudget(){
  if(ImgStore.mode !== 'local') return 0;
  let byCount = 0, byBudget = 0;
  while(state.garments.length > CONFIG.LIMITS.localMaxGarments){
    if(!dropOldestGarment()) break;
    byCount++;
  }
  let guard = 0;
  while(dataUrlBytes(state) > CONFIG.LIMITS.localImageBudget && state.garments.length && guard < 200){
    if(!dropOldestGarment()) break;
    byBudget++;
    guard++;
  }
  const dropped = byCount + byBudget;
  if(byBudget) toast(`已达容量上限（${(CONFIG.LIMITS.localImageBudget/1024/1024).toFixed(1)} MB），请清理后再导入；本次已淘汰 ${byBudget} 件最早的单品`);
  else if(byCount) toast(`已达件数上限 ${CONFIG.LIMITS.localMaxGarments} 件，已按最近使用淘汰 ${byCount} 件旧单品`);
  return dropped;
}

let storageInfoTimer = null;
function scheduleStorageInfo(){
  if(storageInfoTimer) clearTimeout(storageInfoTimer);
  storageInfoTimer = setTimeout(()=>{ storageInfoTimer = null; refreshStorageInfo(); }, 600);
}

async function refreshStorageInfo(){
  const stat = await ImgStore.stats();
  ui.storageInfo = stat;
  if(ui.tab==='me' && !ui.editingId) render();
  return stat;
}

async function clearOriginals(){
  if(ImgStore.mode !== 'idb'){ toast('当前是受限模式，不保留原图，无需清理'); return; }
  const s = await ImgStore.stats();
  if(!s.origBytes){ toast('没有可清理的原图'); return; }
  if(!window.confirm(`清理原图可释放约 ${(s.origBytes/1024/1024).toFixed(2)} MB；清理后无法再重设裁切框或恢复去背前的原图。继续？`)) return;
  let freed = 0;
  for(const {owner, it} of assetItemList()){
    if(!it.asset || !it.asset.orig) continue;
    freed += it.asset.orig;
    await ImgStore.delAsset(owner, it.id, 'orig');
    it.asset.orig = 0;
    it.origUrl = null;
  }
  const json = buildMetaJson();
  try{ localStorage.setItem(CONFIG.STORAGE_V2, json); }catch(e){}
  await ImgStore.putMeta(json);
  await refreshStorageInfo();
  toast(`已清理原图，释放 ${(freed/1024/1024).toFixed(2)} MB，缩略图与大图仍保留`);
}

ImgStore.stats = async function(){
  if(this.mode !== 'idb'){
    return {
      mode:'local',
      used: dataUrlBytes(state),
      quota: CONFIG.LIMITS.localImageBudget,
      count: state.garments.length,
      origBytes: 0,
      failures: 0
    };
  }
  let used = 0, origBytes = 0;
  assetItemList().forEach(({it})=>{
    if(!it.asset) return;
    used += (it.asset.thumb||0) + (it.asset.full||0) + (it.asset.orig||0);
    origBytes += (it.asset.orig||0);
  });
  let quota = 0;
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      quota = est.quota || 0;
      if(est.usage){ used = Math.max(used, est.usage); }
    }
  }catch(e){}
  return {mode:'idb', used, quota, count: state.garments.length, origBytes, failures: assetFailures};
};

function persist(){
  try{
    if(ImgStore.mode === 'idb'){
      localStorage.setItem(CONFIG.STORAGE_V2, buildMetaJson());
    }else{
      enforceLocalBudget();
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state));
    }
    storageOK = true;
  }catch(e){
    storageOK = false;
    if(ImgStore.mode === 'local'){
      let saved = false;
      for(let i=0;i<3 && !saved;i++){
        if(!dropOldestGarment()) break;
        try{ localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); saved = true; storageOK = true; }catch(_){}
      }
      if(saved) toast('存储空间不足，已淘汰最早的单品后保存');
    }
  }
  queueAssetSync();
  scheduleStorageInfo();
  return storageOK;
}

function persistOrWarn(){
  if(persist()) return true;
  toast('本地存储空间不足，改动只在当前页面生效');
  return false;
}

/* =============================================================================
   3. AI 接口：OpenAI 兼容协议、超时、错误分类、JSON 容错解析
   ============================================================================= */
class AIError extends Error {
  constructor(message, kind, status){
    super(message);
    this.name = 'AIError';
    this.kind = kind || 'unknown';
    this.status = status || 0;
  }
}

/* 最近一次 AI 请求的诊断快照（用于失败弹窗与设置页「诊断」，Key/图片均不落明文） */
let lastAIDiag = null;

function aiEndpoint(baseUrl){
  const base = String(baseUrl||'').trim().replace(/\/+$/,'');
  if(!base) return '';
  if(/\/chat\/completions$/i.test(base)) return base;
  return base + '/chat/completions';
}

function parseJSONFromModel(text){
  if(text==null) throw new AIError('模型没有返回内容','parse');
  let s = String(text).trim();
  s = s.replace(/^\uFEFF/,'');
  const fenced = s.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if(fenced) s = fenced[1].trim();
  const first = s.indexOf('{');
  if(first===-1) throw new AIError('模型返回格式无法解析','parse');
  let depth = 0, inString = false, escaped = false, end = -1;
  for(let i=first;i<s.length;i++){
    const ch = s[i];
    if(inString){
      if(escaped) escaped = false;
      else if(ch==='\\') escaped = true;
      else if(ch==='"') inString = false;
    }else{
      if(ch==='"') inString = true;
      else if(ch==='{') depth++;
      else if(ch==='}'){ depth--; if(depth===0){ end=i; break; } }
    }
  }
  if(end===-1) throw new AIError('模型返回 JSON 不完整','parse');
  let json = s.slice(first,end+1);
  try{
    return JSON.parse(json);
  }catch(e){
    try{ return JSON.parse(json.replace(/,\s*([}\]])/g,'$1')); }
    catch(e2){ throw new AIError('模型返回的 JSON 无法解析','parse'); }
  }
}

function friendlyAIError(err){
  if(err instanceof AIError) return err.message;
  if(err && err.name==='AbortError') return '请求已取消或超时';
  if(err && err.message) return err.message;
  return 'AI 请求失败，已自动降级';
}

/* max_tokens 上限表：前缀匹配；未知模型给保守值 1024，避免厂商参数校验 400 */
const MAX_TOKENS_LIMITS = [
  { prefix:'glm-4.1v', limit:1024 },
  { prefix:'glm-4v', limit:1024 },
  { prefix:'glm-4', limit:4096 },
  { prefix:'qwen2.5-vl', limit:2048 },
  { prefix:'qwen2-vl', limit:2048 },
  { prefix:'qwen-vl', limit:2048 },
  { prefix:'gpt-4', limit:4096 },
  { prefix:'gemini', limit:4096 },
  { prefix:'claude', limit:4096 }
];
function maxTokensLimitFor(model){
  const raw = String(model||'').trim().toLowerCase();
  if(!raw) return 1024;
  const bare = raw.indexOf('/') >= 0 ? raw.slice(raw.lastIndexOf('/')+1) : raw;
  for(let i=0;i<MAX_TOKENS_LIMITS.length;i++){
    const row = MAX_TOKENS_LIMITS[i];
    if(raw.indexOf(row.prefix) === 0 || bare.indexOf(row.prefix) === 0) return row.limit;
  }
  return 1024;
}

/* 从「max_tokens参数非法：限制数值范围[1,1024]」这类报错里取上限；取不到返回 0 */
function parseMaxTokensLimit(text){
  const s = String(text||'');
  const m = s.match(/max[_\s-]?tokens[^0-9]{0,48}?(\d+)\s*\]/i)
    || s.match(/\[\s*\d+\s*,\s*(\d+)\s*\]/)
    || s.match(/max[_\s-]?tokens[^0-9]{0,48}?(\d+)/i);
  const n = m ? Number(m[1]) : 0;
  return isFinite(n) && n > 0 ? Math.floor(n) : 0;
}

/* 是否为「参数超限」类 400：智谱 code 1210，或报错同时提到 max_tokens 与范围 */
function isParamLimitError(status, body, detail){
  if(status !== 400 && status !== 422) return false;
  const s = String(body||'') + ' ' + String(detail||'');
  if(/"code"\s*:\s*"?1210"?/.test(s)) return true;
  if(/max[_\s-]?tokens/i.test(s) && /(非法|范围|上限|超出|不能大于|invalid|range|exceed|maximum)/i.test(s)) return true;
  return false;
}

function aiMessageText(content){
  if(typeof content==='string') return content;
  if(Array.isArray(content)){
    return content.map(part=>{
      if(typeof part==='string') return part;
      if(part && typeof part.text==='string') return part.text;
      if(part && typeof part.content==='string') return part.content;
      return '';
    }).join('\n');
  }
  return '';
}

async function aiChat(options){
  const cfg = options.config || aiConfig;
  const model = String(options.model || cfg.textModel || cfg.visionModel || '').trim();
  if(!cfg.apiKey || !model || !isValidBaseUrl(cfg.baseUrl)){
    throw new AIError('尚未配置可用配置：请选择预设、填写 API Key，并确认模型/接入点 ID','config');
  }
  const url = aiEndpoint(cfg.baseUrl);
  const timeoutMs = options.timeoutMs || CONFIG.AI.timeoutMs;
  const reqSummary = summarizeAIRequest(options.messages);
  const diag = {
    at: new Date().toLocaleString('zh-CN', { hour12:false }),
    url, model,
    isVision: reqSummary.hasImage,
    startedAt: Date.now(), durationMs: 0,
    status: 0, statusText: '',
    body: '', errorName: '', errorMessage: '',
    request: reqSummary
  };
  lastAIDiag = diag;
  const externalSignal = options.signal;
  const controller = new AbortController();
  let timedOut = false;
  let externalAborted = false;
  const timer = setTimeout(()=>{
    timedOut = true;
    try{ controller.abort(); }catch(e){}
  }, timeoutMs);
  const onExternalAbort = ()=>{ externalAborted = true; try{ controller.abort(); }catch(e){} };
  if(externalSignal){
    if(externalSignal.aborted) onExternalAbort();
    else externalSignal.addEventListener('abort', onExternalAbort, { once:true });
  }
  /* 发送前按模型上限 clamp，避免厂商直接 400 */
  let maxTokens = options.maxTokens || 500;
  const tokenLimit = maxTokensLimitFor(model);
  if(maxTokens > tokenLimit) maxTokens = tokenLimit;
  let paramRetried = false;
  try{
    let res;
    for(let attempt=0; attempt<2; attempt++){
    try{
      res = await fetch(url,{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer '+cfg.apiKey
        },
        body: JSON.stringify({
          model: model,
          messages: options.messages,
          temperature: options.temperature==null ? CONFIG.AI.temperature : options.temperature,
          max_tokens: maxTokens,
          stream: false
        }),
        signal: controller.signal,
        mode:'cors'
      });
    }catch(networkErr){
      diag.errorName = (networkErr && networkErr.name) || '';
      diag.errorMessage = (networkErr && networkErr.message) || '';
      diag.durationMs = Date.now() - diag.startedAt;
      if(networkErr && networkErr.name==='AbortError'){
        if(timedOut) throw new AIError('请求超时（'+Math.round(timeoutMs/1000)+' 秒）。建议检查网络与网关，或换用更快的模型后重试','timeout');
        if(externalAborted) throw new AIError('已取消 AI 请求','cancelled');
        throw new AIError('请求已取消','cancelled');
      }
      throw new AIError('网络或 CORS 失败。建议：① 检查网络和 Base URL；② 换支持 CORS 的网关或 Cloudflare Worker 代理；③ 确认该服务允许浏览器直连。','network');
    }
    if(res.ok) break;
    diag.status = res.status;
    diag.statusText = res.statusText || '';
    let detail = '';
    let serverMsg = '';
    try{
      const raw = await res.text();
      diag.body = String(raw||'').slice(0,2000);
      try{
        const j = JSON.parse(raw);
        serverMsg = (j.error && (j.error.message || j.error.code)) || j.message || '';
        detail = serverMsg || raw;
      }catch(e){ detail = raw; serverMsg = raw; }
    }catch(e){}
    diag.durationMs = Date.now() - diag.startedAt;
    detail = String(detail||'').slice(0,180);
    serverMsg = String(serverMsg||detail||'').slice(0,180);
    /* 参数超限（如智谱 1210）：按上限降额后静默重试一次，用户无感 */
    if(!paramRetried && isParamLimitError(res.status, diag.body, detail)){
      const parsed = parseMaxTokensLimit(diag.body + ' ' + detail);
      maxTokens = Math.max(1, Math.min(parsed || 1024, tokenLimit));
      paramRetried = true;
      continue;
    }
    if(res.status===401 || res.status===403){
      throw new AIError('鉴权失败（'+res.status+'）：API Key 无效或权限不足。建议检查 Key 是否完整、是否与当前预设匹配；豆包/方舟请确认 Base URL 与接入点归属同一账号。','auth',res.status);
    }
    if(res.status===429){
      throw new AIError('请求过于频繁（429）：建议稍后再试、降低批量、或检查套餐额度。','rate',429);
    }
    if(res.status===404){
      throw new AIError('接口或模型不存在（404）：请检查 Base URL；豆包/方舟需要填推理接入点 ID（ep-xxxx）而非模型名；通义请确认使用兼容模式地址。'+(detail?' 接口返回：'+detail:''),'notfound',404);
    }
    if(isParamLimitError(res.status, diag.body, detail)){
      throw new AIError('请求参数不合法：'+(serverMsg||detail||'服务器未说明具体参数')+'。建议降低输出长度（max_tokens），或把一次识别的商品数量减到 8 件以内分批上传。','param',res.status);
    }
    throw new AIError('接口返回错误 '+res.status+'。建议检查 Base URL、模型名/接入点 ID、Key 权限与余额。'+(detail?' 详情：'+detail:''),'http',res.status);
    }
    let data;
    try{
      data = await res.json();
    }catch(e){
      diag.errorName = (e && e.name) || 'ParseError';
      diag.errorMessage = (e && e.message) || '返回不是 JSON';
      diag.durationMs = Date.now() - diag.startedAt;
      throw new AIError('接口返回的不是 JSON，可能不是 OpenAI 兼容接口','parse');
    }
    diag.status = res.status;
    diag.statusText = res.statusText || '';
    const choices = (data.choices || (data.data && data.data.choices) || []);
    const msg = choices[0] && (choices[0].message || choices[0].delta || choices[0].text);
    let content = '';
    if(typeof msg==='string') content = msg;
    else if(msg && msg.content!=null) content = aiMessageText(msg.content);
    else if(choices[0] && choices[0].text) content = choices[0].text;
    diag.body = String(content||'').slice(0,2000);
    diag.durationMs = Date.now() - diag.startedAt;
    if(!content) throw new AIError('接口返回了空内容','empty');
    return content;
  } finally {
    clearTimeout(timer);
    if(!diag.durationMs) diag.durationMs = Math.max(1, Date.now() - diag.startedAt);
    if(externalSignal) externalSignal.removeEventListener('abort',onExternalAbort);
  }
}

/* 请求体摘要：只统计图片信息，不保留 base64 原文 */
function summarizeAIRequest(messages){
  const arr = Array.isArray(messages) ? messages : [];
  let hasImage = false, images = 0, mime = '', base64Bytes = 0;
  arr.forEach(m=>{
    if(!m || !Array.isArray(m.content)) return;
    m.content.forEach(part=>{
      if(!part || part.type!=='image_url') return;
      hasImage = true;
      const u = String((part.image_url && part.image_url.url) || '');
      const m2 = /^data:([^;]+);base64,([A-Za-z0-9+/=]+)$/i.exec(u);
      if(m2){
        images++;
        if(!mime) mime = m2[1];
        base64Bytes += Math.floor(m2[2].length * 3 / 4);
      }else if(u){
        images++;
        mime = mime || 'url';
      }
    });
  });
  return { messages: arr.length, hasImage, images, mime, base64Bytes };
}

/* API Key 脱敏：保留前 4 位与后 4 位 */
function maskedKey(key){
  const s = String(key || '');
  if(!s) return '(未填写)';
  if(s.length <= 8) return '***';
  return s.slice(0,4) + '***' + s.slice(-4);
}

/* 诊断文本里彻底去掉可能出现的长 base64 */
function sanitizeDiagText(text){
  return String(text || '').replace(/data:image\/[^;]+;base64,[A-Za-z0-9+/=]{200,}/gi, '[base64 图片数据已省略]');
}

/* 检查模型名里的不可见字符：全角空格 / 零宽字符 / 换行 / 首尾空格 */
function inspectModelName(name){
  const raw = String(name == null ? '' : name);
  const issues = [];
  if(/[\u3000]/.test(raw)) issues.push('全角空格');
  if(/[\u200B-\u200D\uFEFF]/.test(raw)) issues.push('零宽字符');
  if(/[\r\n]/.test(raw)) issues.push('换行');
  else if(/^\s|\s$/.test(raw)) issues.push('首尾空格');
  return { raw, length: raw.length, issues };
}

function buildAIDiagText(fail){
  const d = lastAIDiag || {};
  const req = d.request || {};
  const f = (fail === undefined) ? (ui.importFail || null) : fail;
  const sentVision = (d.isVision && d.model) ? d.model : (aiConfig.visionModel || '');
  const insp = inspectModelName(sentVision);
  const lines = [];
  lines.push('【衣橱灵感 · AI 识图诊断】');
  lines.push('时间：' + (d.at || new Date().toLocaleString('zh-CN', { hour12:false })));
  lines.push('Base URL：' + (d.url || aiConfig.baseUrl || '(未填写)'));
  lines.push('视觉模型：' + (aiConfig.visionModel || '(未填写)'));
  lines.push('视觉模型原文："' + insp.raw + '"（长度 ' + insp.length + ' 位' + (d.isVision ? '，本次实际发送' : '，当前配置') + '）');
  if(insp.issues.length) lines.push('⚠ 模型名含不可见字符，请重新输入（检测到：' + insp.issues.join('、') + '）');
  lines.push('文本模型：' + (aiConfig.textModel || '(未填写)'));
  lines.push('API Key：' + maskedKey(aiConfig.apiKey));
  lines.push('HTTP 状态：' + (d.status ? (d.status + ' ' + (d.statusText || '')) : '无响应'));
  lines.push('耗时：' + (d.durationMs==null ? '未知' : (d.durationMs + ' ms')));
  lines.push('请求体摘要：messages ' + (req.messages || 0) + ' 条 · 含 image_url：' + (req.hasImage ? '是' : '否') +
    ' · 图片 MIME：' + (req.mime || '无') + ' · base64 字节数：' + (req.base64Bytes || 0));
  if(d.errorName || d.errorMessage){
    lines.push('网络异常：' + (d.errorName || '') + ' · ' + (d.errorMessage || ''));
  }
  if(f){
    lines.push('失败分类：' + (f.kind || 'unknown') + ' · ' + (f.step || ''));
    if(f.detail) lines.push('原始信息：' + String(f.detail).replace(/\n/g, ' '));
  }
  lines.push('响应体（截断 2000 字符）：');
  lines.push(d.body ? String(d.body).slice(0,2000) : '(无)');
  return sanitizeDiagText(lines.join('\n'));
}

/* 内置 64×64 测试图：纯色底 + 简单形状，转成 dataURL，不读用户文件、不依赖外链 */
function builtinVisionTestImage(){
  try{
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    if(!ctx) return '';
    ctx.fillStyle = '#c2412d';
    ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = '#f5e9d7';
    ctx.beginPath();
    ctx.arc(32, 32, 14, 0, Math.PI * 2);
    ctx.fill();
    return c.toDataURL('image/png');
  }catch(e){ return ''; }
}

/* 视觉连通性测试：真的发一张图，验证视觉模型支持图片输入。modelOverride/timeoutOverride 供探测使用 */

/* 视觉测试失败的精准建议：按 HTTP 状态与报错内容区分 */
function describeVisionTestFailure(err){
  const msg = (err && err.message) ? String(err.message) : String(err || '');
  const status = (err && err.status) || 0;
  if(err && err.kind==='config') return '缺少配置：请填写 Base URL、API Key 和视觉模型（VL 系列）。';
  if(err && err.kind==='network') return '网络或 CORS 失败：浏览器可能无法直连该服务。请检查 Base URL 是否可访问，或换支持 CORS 的网关/代理。';
  if(err && err.kind==='timeout') return '请求超时：网络慢或该模型排队。稍后重试，或换更小的 VL 模型。';
  if(status===401) return '401 鉴权失败：API Key 无效或不完整，请重新复制完整 Key（注意前后不要有空格）。';
  if(status===403) return '403 无权限：模型名已正确，但当前账号没有该模型的调用授权。请到控制台「模型广场」确认是否需要单独开通；检查账户余额/免费额度是否覆盖 VL 模型；确认账号已实名；RAM 子账号需主账号授权。短期无法开通可换平台：智谱 AI（glm-4v-flash 免费识图）或硅基流动（托管 Qwen VL）。';
  if(status===404) return '404 模型不存在：视觉模型名或接入点 ID 写错了。豆包/方舟填 ep-xxxx；通义填 qwen-vl-max 等 VL 模型名。可点下方「探测可用视觉模型」自动找到可用型号。';
  if(status===429) return '429 限流：稍等 30 秒再试，或检查套餐额度与并发限制。';
  if(status===413) return '413 请求体过大：测试图仅 64×64，若仍报体积错误，多半是网关限制，请检查代理配置。';
  if(err && err.kind==='param') return '请求参数不合法：'+msg+'。建议降低输出长度（max_tokens，如识别用 1024），或把一次识别的商品数量减到 8 件以内分批重试。';
  if(status===400 && /(image|图片|vision|multimodal|content[^\n]{0,12}type|invalid[^\n]{0,12}content|unsupported|not support)/i.test(msg)){
    return '当前视觉模型不支持图片输入：请把「视觉模型」改为 qwen-vl-max / qwen2.5-vl-* / doubao-vision 等 VL 模型；qwen-plus、qwen-max 等纯文本模型不能识图。';
  }
  if(err && err.kind==='parse') return '返回内容无法解析：模型可能不支持图片输入，建议改用 VL 系列模型后重试。';
  if(err && err.kind==='empty') return '模型返回空内容：确认该模型支持图片输入，或稍后重试。';
  return msg || '未知错误，请检查配置后重试';
}

function normalizeAITagResult(raw){
  const obj = raw && (raw.穿搭 || raw.单品 || raw.data || raw.result || raw);
  if(!obj || typeof obj!=='object') throw new AIError('模型识图结果不是对象','parse');
  const categoryRaw = obj['品类'] || obj.category || obj['类别'] || '上装';
  const primaryRaw = obj['主色'] || obj.primaryColor || obj.color || obj['颜色'] || '米白';
  const secondaryRaw = obj['次色'] || obj.secondaryColor || '';
  const stylesRaw = obj['风格'] || obj.styles || obj.style || [];
  const seasonsRaw = obj['季节'] || obj.seasons || obj.season || [];
  const formalityRaw = obj['正式度'] || obj.formality || 3;
  const materialRaw = obj['材质'] || obj.material || '未知';
  const descRaw = obj['描述'] || obj.description || '';
  let styles = [];
  if(Array.isArray(stylesRaw)) stylesRaw.forEach(s=>{ const id=normalizeStyleId(s); if(id) styles.push(id); });
  else { const id=normalizeStyleId(stylesRaw); if(id) styles.push(id); }
  if(!styles.length) styles = ['cleanfit'];
  return {
    category: normalizeCategory(categoryRaw),
    colorName: nearestPaletteColor(primaryRaw),
    secondaryColor: secondaryRaw ? nearestPaletteColor(secondaryRaw) : '',
    styles: Array.from(new Set(styles)).slice(0,3),
    seasons: normalizeSeasons(seasonsRaw),
    formality: clamp(Math.round(Number(formalityRaw)||3),1,5),
    material: String(materialRaw||'未知').slice(0,24),
    description: String(descRaw||'').slice(0,60)
  };
}

function normalizeAIProfile(raw){
  const obj = raw && (raw.风格画像 || raw.穿搭 || raw.data || raw.result || raw);
  if(!obj || typeof obj!=='object') throw new AIError('模型风格解析结果不是对象','parse');
  let tagsRaw = obj['风格标签'] || obj.tags || obj['标签'] || [];
  if(typeof tagsRaw==='string') tagsRaw = tagsRaw.split(/[、,，/]/);
  if(!Array.isArray(tagsRaw)) tagsRaw = [];
  let paletteRaw = obj['配色'] || obj.palette || obj.colors || [];
  if(typeof paletteRaw==='string') paletteRaw = paletteRaw.split(/[、,，/]/);
  if(!Array.isArray(paletteRaw)) paletteRaw = [];
  const palette = Array.from(new Set(paletteRaw.map(nearestPaletteColor))).slice(0,5);
  const styleId = normalizeStyleId(obj['对应风格'] || obj.style || obj.styleId || '') || '';
  return {
    tags: tagsRaw.map(t=>String(t||'').trim()).filter(Boolean).slice(0,5),
    palette,
    silhouette: String(obj['廓形'] || obj.silhouette || '').slice(0,40),
    layering: String(obj['层次'] || obj.layering || '').slice(0,50),
    accessories: String(obj['配饰'] || obj.accessories || '').slice(0,40),
    mood: String(obj['气质'] || obj.mood || '').slice(0,24),
    formality: clamp(Math.round(Number(obj['正式度'] || obj.formality || 3)||3),1,5),
    styleId
  };
}

/* =============================================================================
   4. 搭配生成引擎（纯规则，不依赖 DOM；可直接移植到小程序）
   ============================================================================= */
const StylingEngine = (function(){
  const QUIET_STYLES = ['oldmoney','minimal','french','cleanfit'];
  const BOLD_STYLES = ['y2k','street','sweetcool'];

  function hashString(str){
    let h = 2166136261;
    for(let i=0;i<String(str).length;i++){
      h ^= String(str).charCodeAt(i);
      h = Math.imul(h,16777619);
    }
    return (h>>>0)/4294967295;
  }
  function colorSaturation(hex){
    const rgb = hexToRgb(hex);
    const max = Math.max(rgb.r,rgb.g,rgb.b);
    const min = Math.min(rgb.r,rgb.g,rgb.b);
    return max<=0 ? 0 : (max-min)/max;
  }
  function outfitKey(items){
    return (items||[]).map(it=>it.id).sort().join('|');
  }
  function coreOf(items){
    return items.filter(it=>['top','bottom','dress','outer','shoes'].includes(it.category));
  }
  function itemWeight(it){
    if(it.category==='top') return 1.25;
    if(it.category==='bottom') return 1.2;
    if(it.category==='dress') return 1.45;
    if(it.category==='outer') return 0.82;
    if(it.category==='shoes') return 1.0;
    if(it.category==='bag') return 0.38;
    if(it.category==='accessory') return 0.3;
    return 0.6;
  }
  function relation(a,b,styleId){
    if(!a || !b) return 0.7;
    if(a.colorName===b.colorName) return 0.97;
    const ca=getColor(a.colorName), cb=getColor(b.colorName);
    const d=colorFamilyDistance(a.colorName,b.colorName);
    const bold= BOLD_STYLES.includes(styleId);
    if(ca.family==='neutral' && cb.family==='neutral') return 0.95;
    if(ca.family==='neutral' || cb.family==='neutral') return 0.9;
    if(ca.family===cb.family){
      if(d<=20) return 0.94;
      if(d<=52) return 0.84;
      return 0.7;
    }
    if(d<=35) return 0.82;
    if(d<=68) return 0.71;
    if(d>=138) return bold ? 0.82 : 0.52;
    if(d<=105) return 0.61;
    return 0.55;
  }
  function scoreColors(items, styleId){
    const style=getStyle(styleId);
    let total=0, weight=0;
    for(let i=0;i<items.length;i++){
      for(let j=i+1;j<items.length;j++){
        const a=items[i], b=items[j];
        let w=1;
        if(a.category==='bag'||b.category==='bag'||a.category==='accessory'||b.category==='accessory') w=0.42;
        if(a.category==='outer'||b.category==='outer') w=Math.min(w,0.82);
        total += relation(a,b,styleId)*w;
        weight += w;
      }
    }
    const avg = weight ? total/weight : 0.7;
    const uniqueColors = Array.from(new Set(items.map(it=>it.colorName)));
    const core = coreOf(items);
    const neutralAnchor = core.some(it=>getColor(it.colorName).family==='neutral');
    const paletteHit = core.filter(it=>style.palette.includes(it.colorName)).length / Math.max(1,core.length);
    const vividCount = core.filter(it=>colorSaturation(getColor(it.colorName).hex)>0.32).length;
    let base = avg*23 + paletteHit*3 + (neutralAnchor?1.8:0);
    if(uniqueColors.length<=3) base += 1.4;
    if(uniqueColors.length>=5) base -= 1.2;
    if(QUIET_STYLES.includes(styleId) && vividCount>=2) base -= 1.1;
    return clamp(base,0,30);
  }
  function styleAffinity(item, styleId){
    const styles = item.styles || [];
    if(styles.includes(styleId)) return 1;
    const related = STYLE_RELATIONS[styleId] || [];
    if(styles.some(s=>related.includes(s) || (STYLE_RELATIONS[s]||[]).includes(styleId))) return 0.74;
    return 0.22;
  }
  function scoreStyle(items, styleId, ctx){
    const style=getStyle(styleId);
    let weighted=0, weights=0;
    items.forEach(it=>{
      weighted += styleAffinity(it,styleId)*itemWeight(it);
      weights += itemWeight(it);
    });
    const avg = weights ? weighted/weights : 0.2;
    const hits = items.filter(it=>style.keywords.some(k=>String(it.name||'').includes(k))).length;
    const keywordBonus = Math.min(3.8,hits*0.85);
    const refs = (ctx.refs||[]).filter(r=>r.liked!==false && r.styleId===styleId);
    let refBonus = 0;
    refs.forEach(r=>{ refBonus += r.liked===true ? 0.55 : 0.25; });
    refBonus = Math.min(2.2,refBonus);
    const dislikedRefs = (ctx.refs||[]).filter(r=>r.liked===false && r.styleId===styleId).length;
    return clamp(avg*17 + keywordBonus + refBonus - dislikedRefs*0.7,0,25);
  }
  function scoreFormality(items, styleId){
    const style=getStyle(styleId);
    const relevant=items.filter(it=>['top','bottom','dress','outer','shoes'].includes(it.category));
    const vals=relevant.map(it=>clamp(Number(it.formality)||3,1,5));
    const avg=vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 3;
    const min=style.formality[0], max=style.formality[1];
    const distance = avg<min ? min-avg : (avg>max ? avg-max : 0);
    const spread = vals.length ? Math.max.apply(null,vals)-Math.min.apply(null,vals) : 0;
    let penalty = distance*4.2;
    if(spread>=3) penalty += 3;
    else if(spread>=2) penalty += 1.8;
    return { score:clamp(15-penalty,3,15), avg:round1(avg), spread:round1(spread) };
  }
  function seasonFit(item, season){
    const seasons = item.seasons || [];
    if(seasons.includes(season)) return 1;
    if(season==='春秋') return seasons.includes('夏')?0.55:(seasons.includes('冬')?0.68:0.5);
    if(season==='夏') return seasons.includes('春秋')?0.55:0.18;
    if(season==='冬') return seasons.includes('春秋')?0.66:0.16;
    return 0.5;
  }
  function scoreSeason(items, season, styleId){
    const core=coreOf(items);
    const vals=core.map(it=>seasonFit(it,season));
    const avg=vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0.6;
    let score=avg*15;
    const hasOuter=items.some(it=>it.category==='outer');
    if(season==='冬' && !hasOuter) score -= 2.2;
    if(season==='夏' && hasOuter) score -= 1.0;
    return { score:clamp(score,2,15), avg:round2(avg) };
  }
  function profileOverlap(outfit, profile){
    if(!profile || !Array.isArray(profile.palette) || !profile.palette.length) return 0;
    const colors = new Set(outfit.map(it=>it.colorName));
    const hits = profile.palette.filter(c=>colors.has(c)).length;
    return hits / Math.min(4, profile.palette.length);
  }
  function scoreHistory(items, styleId, ctx){
    const style=getStyle(styleId);
    const prefs=ctx.prefs||{};
    let score=7.5;
    score += clamp(Number(prefs[styleId]||0),-2,2)*1.4;
    const refs=(ctx.refs||[]).filter(r=>r.liked!==false);
    let refContribution=0;
    refs.forEach(ref=>{
      const weight = ref.liked===true ? 1.0 : 0.45;
      if(ref.styleId===styleId) refContribution += 0.7*weight;
      if(ref.profile){
        refContribution += profileOverlap(items,ref.profile)*1.35*weight;
        const avgFormality=items.filter(it=>['top','bottom','dress','shoes'].includes(it.category))
          .map(it=>Number(it.formality)||3).reduce((a,b,arr)=>a+b,0)/Math.max(1,items.filter(it=>['top','bottom','dress','shoes'].includes(it.category)).length);
        refContribution += Math.max(0,1-Math.abs(avgFormality-(ref.profile.formality||3))/4)*0.45*weight;
      }
    });
    score += Math.min(4.3,refContribution);
    const favorites=(ctx.favorites||[]).slice(0,6);
    favorites.forEach(fav=>{
      const favIds=(fav.items||[]).map(it=>it.id);
      const shared=items.filter(it=>favIds.includes(it.id)).length;
      if(shared>=2) score += 1.05;
      else if(shared===1) score += 0.35;
    });
    const likes=Array.from(new Set(favorites.flatMap(f=>(f.items||[]).map(it=>it.id))));
    let sharedLikes=0;
    items.forEach(it=>{ if(likes.includes(it.id)) sharedLikes++; });
    score += Math.min(1.8,sharedLikes*0.55);
    const dislikedItems=ctx.feedback && ctx.feedback.dislikedItems || {};
    let dislikedHits=0;
    items.forEach(it=>{ if(dislikedItems[it.id]) dislikedHits += Number(dislikedItems[it.id])||1; });
    score -= Math.min(4,dislikedHits*0.9);
    const likedKeys=ctx.feedback && ctx.feedback.likedKeys || [];
    if(likedKeys.includes(outfitKey(items))) score += 1.2;
    return clamp(score,0,15);
  }
  function scoreOutfit(items, ctx){
    const styleId=ctx.styleId;
    const color=scoreColors(items,styleId);
    const style=scoreStyle(items,styleId,ctx);
    const formal=scoreFormality(items,styleId);
    const season=scoreSeason(items,ctx.season,styleId);
    const history=scoreHistory(items,styleId,ctx);
    const total=clamp(color+style+formal.score+season.score+history,0,99);
    return {
      color:round1(color), style:round1(style), formality:round1(formal.score),
      formalityAvg:formal.avg, formalitySpread:formal.spread,
      season:round1(season.score), seasonAvg:season.avg, history:round1(history),
      total:round1(total)
    };
  }
  function findPair(items){
    const top=items.find(it=>it.category==='top');
    const bottom=items.find(it=>it.category==='bottom');
    if(top&&bottom) return [top,bottom];
    const dress=items.find(it=>it.category==='dress');
    if(dress){
      const outer=items.find(it=>it.category==='outer');
      if(outer) return [dress,outer];
      const shoes=items.find(it=>it.category==='shoes');
      if(shoes) return [dress,shoes];
      return [dress,items.find(it=>it.category==='bag')||dress];
    }
    return [items[0],items[1]].filter(Boolean);
  }
  function colorSentence(items, styleId){
    const pair=findPair(items);
    if(pair.length<2) return '单品颜色彼此克制，整体比较耐看';
    const [a,b]=pair;
    if(!a||!b) return '配色简洁，先保证干净';
    if(a.colorName===b.colorName) return `${a.name}与${b.name}用同色系叠穿，纵向线条很顺`;
    const ca=getColor(a.colorName), cb=getColor(b.colorName);
    if(ca.family==='neutral' || cb.family==='neutral'){
      const neutral=ca.family==='neutral'?a:b;
      const accent=ca.family==='neutral'?b:a;
      if(relation(a,b,styleId)>=0.88) return `${neutral.name}做中性打底，${accent.name}把气色提起来`;
      return `${neutral.name}把底色稳住，${accent.name}留出一点变化`;
    }
    const distance=colorFamilyDistance(a.colorName,b.colorName);
    if(relation(a,b,styleId)>=0.84) return `${a.name}和${b.name}是邻近色，过渡自然`;
    if(distance>=138) return `${a.name}与${b.name}做了轻撞色，记忆点更明确`;
    return `${a.name}和${b.name}冷暖平衡，整体不飘`;
  }
  function shoeSentence(items){
    const shoe=items.find(it=>it.category==='shoes');
    if(!shoe) return '';
    const rgb=hexToRgb(shoe.colorHex||getColor(shoe.colorName).hex);
    const luminance=(rgb.r+rgb.g+rgb.b)/3;
    const color=getColor(shoe.colorName);
    if(color.family==='neutral' && luminance<110) return `${shoe.name}把重心压稳`;
    if(color.family==='neutral' && luminance>210) return `${shoe.name}让整体更轻`;
    return `${shoe.name}留了一处色彩呼应`;
  }
  function formalitySentence(avg, styleId){
    const style=getStyle(styleId);
    const [min,max]=style.formality;
    if(avg>max+0.25) return `正式度 ${avg}，比${style.name}的常用区间更正式一点`;
    if(avg<min-0.25) return `正式度 ${avg}，比${style.name}的常用区间更松弛`;
    if(avg>=3.6) return `正式度 ${avg}，通勤或见客户都稳`;
    if(avg>=3.0) return `正式度 ${avg}，日常通勤刚好`;
    if(avg>=2.3) return `正式度 ${avg}，周末出门轻松不随便`;
    return `正式度 ${avg}，松弛感更多一些`;
  }
  function seasonSentence(items, season){
    const hasOuter=items.some(it=>it.category==='outer');
    if(season==='春秋'){
      return hasOuter ? '春秋有外套兜住早晚温差，层次也完整' : '春秋单穿刚好，早晚添件外套就行';
    }
    if(season==='夏'){
      return hasOuter ? '夏天空调房加件薄外套正好' : '夏天清爽，不会闷';
    }
    if(season==='冬'){
      return hasOuter ? '冬天有外套撑层次，保暖也够' : '冬天偏单薄，建议再加一件厚外套';
    }
    return '换季时注意早晚温差';
  }
  function makeReason(items, ctx, breakdown){
    const style=getStyle(ctx.styleId);
    const sentences=[];
    let first=colorSentence(items,ctx.styleId);
    const shoe=shoeSentence(items);
    if(shoe) first += '，'+shoe;
    sentences.push(first+'。');
    const formality=formalitySentence(breakdown.formalityAvg, ctx.styleId);
    sentences.push(`整体走${style.name}的${style.mood}路线；${formality}，${seasonSentence(items,ctx.season)}。`);
    const extras=[];
    const outer=items.find(it=>it.category==='outer');
    const bag=items.find(it=>it.category==='bag');
    if(outer) extras.push(`${outer.name}把外层轮廓撑起来`);
    if(bag) extras.push(`${bag.name}收住整体量感`);
    const currentIds=items.map(it=>it.id);
    const shared=(ctx.favorites||[]).map(f=>(f.items||[]).find(it=>currentIds.includes(it.id))).filter(Boolean)[0];
    const refs=(ctx.refs||[]).filter(r=>r.liked===true && r.styleId===ctx.styleId);
    if(shared){
      extras.push(`还沿用了你收藏过的${shared.name}`);
    }else if(refs.length){
      extras.push(`也参考了你喜欢的 ${refs.length} 张${style.name}灵感`);
    }
    if(extras.length) sentences.push(extras.slice(0,2).join('，')+'。');
    return sentences.join('');
  }
  function ordered(items){
    const order={outer:0,top:1,dress:1,bottom:2,shoes:3,bag:4,accessory:5};
    return items.slice().sort((a,b)=>(order[a.category]??9)-(order[b.category]??9));
  }
  function chooseOptional(baseItems, candidates, ctx){
    if(!candidates.length) return baseItems;
    let best={items:baseItems,score:scoreOutfit(baseItems,ctx).total};
    candidates.forEach(c=>{
      const testItems=baseItems.concat([c]);
      const s=scoreOutfit(testItems,ctx).total;
      if(s>=best.score+0.15) best={items:testItems,score:s};
    });
    return best.items;
  }
  function generate(garments, ctx){
    const all=(garments||[]).filter(Boolean);
    if(!all.length){
      return { error:'empty', candidates:[], message:'衣柜还是空的，先放进几件自己的衣服吧。' };
    }
    const tops=all.filter(g=>g.category==='top');
    const bottoms=all.filter(g=>g.category==='bottom');
    const dresses=all.filter(g=>g.category==='dress');
    const shoes=all.filter(g=>g.category==='shoes');
    const outers=all.filter(g=>g.category==='outer');
    const bags=all.filter(g=>g.category==='bag');
    const accessories=all.filter(g=>g.category==='accessory');
    if(!shoes.length){
      return { error:'needShoes', candidates:[], message:'还差一双鞋，补上后就能生成完整搭配。' };
    }
    if(!dresses.length && !tops.length){
      return { error:'needTop', candidates:[], message:'还差一件上装或一条连身裙，先把上半身穿搭补全。' };
    }
    if(!dresses.length && !bottoms.length){
      return { error:'needBottom', candidates:[], message:'还差一条下装，和现有上装凑成一套。' };
    }
    const bases=[];
    if(dresses.length){
      dresses.forEach(d=>{
        shoes.forEach(s=>bases.push([d,s]));
      });
    }
    tops.forEach(t=>{
      bottoms.forEach(b=>{
        shoes.forEach(s=>bases.push([t,b,s]));
      });
    });
    if(!bases.length){
      return { error:'needBase', candidates:[], message:'至少需要「上装 + 下装」或「连身裙」再加一双鞋。' };
    }
    const capped=bases.length>1200 ? bases.slice(0,1200) : bases;
    const disliked=(ctx.feedback && ctx.feedback.dislikedKeys) || [];
    const dislikedItems=(ctx.feedback && ctx.feedback.dislikedItems) || {};
    const seen=new Set();
    const candidates=[];
    capped.forEach(base=>{
      if(base.some(it=>dislikedItems[it.id])) return;
      let items=ordered(base);
      items=ordered(chooseOptional(items,outers,ctx));
      items=ordered(chooseOptional(items,bags,ctx));
      items=ordered(chooseOptional(items,accessories,ctx));
      const key=outfitKey(items);
      if(seen.has(key) || disliked.includes(key)) return;
      seen.add(key);
      const breakdown=scoreOutfit(items,ctx);
      const jitter=(hashString(key+(ctx.seed||0))-0.5)*1.4;
      const finalScore=clamp(round1(breakdown.total+jitter),0,99);
      const finalBreakdown=Object.assign({},breakdown,{total:finalScore});
      candidates.push({
        key, items, styleId:ctx.styleId, styleName:getStyle(ctx.styleId).name,
        season:ctx.season, score:finalScore, breakdown:finalBreakdown,
        reason:makeReason(items,ctx,finalBreakdown), reasonSource:'local', aiReasonState:'idle'
      });
    });
    if(!candidates.length){
      return {
        error:'exhausted', candidates:[],
        message:'当前组合都被你标记过“不喜欢”了，补一件新单品或重新生成试试。'
      };
    }
    candidates.sort((a,b)=>{
      if(b.score!==a.score) return b.score-a.score;
      return a.key.localeCompare(b.key);
    });
    return { error:null, candidates };
  }
  function suggestStyle(prefs, refs){
    const scores={};
    STYLE_DEFS.forEach(s=>{ scores[s.id]=(Number((prefs||{})[s.id])||0)*2; });
    (refs||[]).forEach(r=>{
      if(r.liked===true) scores[r.styleId]=(scores[r.styleId]||0)+2.5;
      else if(r.liked===null && r.styleId) scores[r.styleId]=(scores[r.styleId]||0)+0.8;
    });
    let best='cleanfit', bestScore=-Infinity;
    STYLE_DEFS.forEach(s=>{
      const value=scores[s.id]??0;
      if(value>bestScore){ bestScore=value; best=s.id; }
    });
    return best;
  }
  return {
    generate, scoreOutfit, outfitKey, relation, suggestStyle,
    colorSentence, makeReason, seasonFit
  };
})();

let toastTimer = null;
function toast(message){
  const el = $('#toast');
  if(!el) return;
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2800);
}

function beginJob(title, sub){
  if(ui.job) cancelJob();
  const controller = new AbortController();
  const job = { controller, cancelled:false };
  ui.job = job;
  const hud = $('#aiHud');
  if(hud){
    hud.classList.add('show');
    $('#aiHudTitle').textContent = title || 'AI 识别中';
    $('#aiHudSub').textContent = sub || '';
  }
  return job;
}
function updateJob(title, sub){
  if(!ui.job) return;
  if(title!=null) $('#aiHudTitle').textContent = title;
  if(sub!=null) $('#aiHudSub').textContent = sub;
}
function endJob(job){
  if(ui.job===job){
    ui.job = null;
    const hud = $('#aiHud');
    if(hud) hud.classList.remove('show');
  }
}
function cancelJob(){
  if(!ui.job) return;
  ui.job.cancelled = true;
  try{ ui.job.controller.abort(); }catch(e){}
}
function cancelAI(){
  if(!ui.job){ toast('当前没有正在进行的 AI 任务'); return; }
  cancelJob();
  updateJob('正在取消…','已发送取消请求');
}

function activeTab(tab){
  $$('#tabbar .tab-item').forEach(item=>{
    item.classList.toggle('active', item.dataset.tab===tab);
  });
}
function switchTab(tab, opts){
  const options = opts || {};
  ui.tab = tab;
  activeTab(tab);
  render();
  if(options.scrollTop!==false){
    const main = $('.main');
    if(main) main.scrollTop = 0;
  }
  if(tab==='outfit' && ui.outfits.length===0 && !ui.genMessage && !ui.generating){
    const enough = state.garments.some(g=>g.category==='shoes') &&
      (state.garments.some(g=>g.category==='dress') ||
       (state.garments.some(g=>g.category==='top') && state.garments.some(g=>g.category==='bottom')));
    if(enough && !ui.autoGenTried){
      ui.autoGenTried = true;
      generateOutfits();
    }
  }
}

function render(){
  const view = $('#view');
  if(!view) return;
  let html = '';
  if(ui.tab==='wardrobe') html = renderWardrobe();
  else if(ui.tab==='styles') html = renderStyles();
  else if(ui.tab==='outfit') html = renderOutfit();
  else html = renderMe();
  view.innerHTML = html;
  activeTab(ui.tab);
  updateModePill();
  renderModal();
}

function wardrobeStats(){
  const counts = {};
  CATEGORY_KEYS.forEach(k=>{ counts[k]=0; });
  state.garments.forEach(g=>{ if(counts[g.category]!=null) counts[g.category]++; });
  return counts;
}
function filteredGarments(){
  return state.garments.filter(g=>{
    if(ui.filterCat!=='all' && g.category!==ui.filterCat) return false;
    if(ui.filterStyle && !(g.styles||[]).includes(ui.filterStyle)) return false;
    if(ui.filterSeason && !(g.seasons||[]).includes(ui.filterSeason)) return false;
