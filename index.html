    case 'pickOutfitStyle': pickOutfitStyle(el.dataset.style); break;
    case 'pickSeason': pickSeason(el.dataset.season); break;
    case 'generateOutfits': generateOutfits(); break;
    case 'shuffleLook': shuffleLook(el.dataset.key); break;
    case 'dislikeLook': dislikeLook(el.dataset.key); break;
    case 'favoriteLook': favoriteLook(el.dataset.key); break;
    case 'polishLook': polishSingleLook(el.dataset.key); break;
    case 'setPreset': applyPreset(el.dataset.preset); break;
    case 'saveAISettings': saveAISettings(); break;
    case 'testAISettings': testAISettings(); break;
    case 'testVisionSettings': testVisionSettings(); break;
    case 'clearAIKey': clearAIKey(); break;
    case 'toggleKeyVisibility': toggleKeyVisibility(); break;
    case 'pickVisionModel': pickVisionModel(el.dataset.model); break;
    case 'probeVisionModels': probeVisionModels(); break;
    case 'probeVisionCancel': if(ui.visionProbe) ui.visionProbe.cancelled = true; updateProbeBox(); break;
    case 'probeUseModel': pickVisionModel(el.dataset.model); break;
    case 'copyFailRecord': copyFailRecord(el.dataset.id); break;
    case 'clearFailLog': clearFailLog(); break;
    case 'exportFavorite': exportFavorite(el.dataset.id); break;
    case 'deleteFavorite': deleteFavoriteById(el.dataset.id); break;
    case 'restoreSamples': restoreSamples(); break;
    case 'refreshStorage': refreshStorageInfo().then(()=>toast('已刷新存储用量')); break;
    case 'clearOriginals': clearOriginals(); break;
    case 'draftRecrop': openGarmentRecrop(); break;
    case 'clearWardrobe': clearWardrobe(); break;
    case 'resetAll': resetAllData(); break;
    case 'cancelAI': cancelAI(); break;
    case 'openBuy': openBuyById(el.dataset.id); break;
    case 'findForItem': openFindForItem(el.dataset.id); break;
    case 'copyLookList': copyLookList(el.dataset.key); break;
    case 'toggleLinked': ui.filterLinked = !ui.filterLinked; render(); break;
    case 'openBulk': openBulkSheet('links'); break;
    case 'openTextImport': openBulkSheet('text'); break;
    case 'addShots': triggerShotInput(false); break;
    case 'bulkConfirm': bulkConfirm(); break;
    case 'bulkAddShots': {
      const bulkBox = $('#bulkText');
      if(bulkBox && ui.bulk) ui.bulk.text = bulkBox.value;
      triggerShotInput(true);
      break;
    }
    case 'closeBulk': ui.bulk = null; renderModal(); break;
    case 'impToggleAll': {
      const rows = (ui.importBatch && ui.importBatch.rows) || [];
      const allOn = rows.every(r=>r.checked);
      rows.forEach(r=>{ r.checked = !allOn; });
      updateImpSelection();
      break;
    }
    case 'impImport': confirmImport(); break;
    case 'impCancel': ui.crop = null; ui.importBatch = null; render(); break;
    case 'shotFailClose': ui.importFail = null; renderModal(); break;
    case 'shotRetry': {
      const f = ui.importFail;
      if(!f || !f.files || !f.files.length){ toast('截图已不可用，请重新上传'); break; }
      const files = f.files.slice();
      const pendingText = (f.combine && f.pending) ? f.pending.map(p=>p.buyUrl||'').filter(Boolean).join('\n') : '';
      ui.importFail = null;
      if(pendingText){ ui.bulk = { mode:'links', text:pendingText }; ui.shotCombine = true; }
      handleShotFiles(files);
      renderModal();
      break;
    }
    case 'shotGoSettings': {
      ui.importFail = null;
      switchTab('me');
      setTimeout(()=>{
        const card = $('#aiSettings');
        if(card) card.scrollIntoView({behavior:'smooth',block:'start'});
      },120);
      break;
    }
    case 'shotManual': ui.importFail = null; openBulkSheet('text'); break;
    case 'copyShotDiag': {
      const text = buildAIDiagText();
      copyText(text, '诊断信息已复制（Key 已脱敏）');
      break;
    }
    case 'shotFilesRetry': {
      const files = (ui.shotFiles || []).slice();
      if(!files.length){ toast('没有可重试的截图'); ui.bulk = null; renderModal(); break; }
      ui.bulk = null;
      handleShotFiles(files);
      renderModal();
      break;
    }
    case 'impRecrop': {
      const rows = (ui.importBatch && ui.importBatch.rows) || [];
      const row = rows.find(r=>r.id===el.dataset.id);
      if(!row || !row.shotUrl){ toast('原截图已不可用，无法重设'); break; }
      const b = row.box || { x:0.06, y:0.06, w:0.88, h:0.88 };
      ui.crop = { rowId: row.id, url: row.shotUrl, x:b.x, y:b.y, w:b.w, h:b.h };
      renderModal();
      break;
    }
    case 'cropCancel': ui.crop = null; renderModal(); break;
    case 'cropConfirm': {
      const c = ui.crop;
      if(!c) break;
      const btn = $('#cropConfirmBtn');
      if(btn){ btn.disabled = true; btn.textContent = '裁切中…'; }
      const box = { x:+c.x.toFixed(3), y:+c.y.toFixed(3), w:+c.w.toFixed(3), h:+c.h.toFixed(3) };
      const task = c.target==='garment' ? cropGarment(c.garmentId, box) : cropRow(c.rowId, box);
      task.then(ok=>{
        if(!ok){ if(btn){ btn.disabled = false; btn.textContent = '用这个框裁切'; } return; }
        ui.crop = null;
        if(c.target==='garment'){
          const g = getGarment(c.garmentId);
          if(g && ui.draft && ui.draft.id===c.garmentId){
            ui.draft.image = g.image;
            ui.draft.bgRemoved = g.bgRemoved;
            ui.draft.originalImage = g.__origSrc || '';
            bgOriginalCache.set(g.id, g.__origSrc || '');
          }
          persist();
          render();
        }
        renderModal();
        toast('已按新框重新裁切');
      });
      break;
    }
    case 'closeFind': ui.findFor = null; renderModal(); break;
    case 'copySearchLinks': {
      const g = (ui.findFor && getGarment(ui.findFor.id)) || ui.findFor || {};
      const links = shopSearchLinks(g);
      copyText(links.map(l=>l.label+'：'+l.url).join('\n'), '搜索链接已复制');
      break;
    }
    case 'openExternal': openExternal(el.dataset.url, el.dataset.label); break;
    case 'copyHintLink': {
      const url = ui.linkHint && ui.linkHint.url;
      if(url) copyText(url, '链接已复制，去 App 粘贴打开');
      else toast('没有可复制的链接');
      break;
    }
    case 'forceOpen': {
      const url = ui.linkHint && ui.linkHint.url;
      if(!url) break;
      ui.linkHint = null;
      try{ window.open(url, '_blank'); }catch(e){}
      renderModal();
      toast('已尝试打开；若仍无反应，请复制链接后去 App 打开');
      break;
    }
    case 'closeLinkHint': ui.linkHint = null; renderModal(); break;
    case 'onbNext': ui.onbStep = Math.min(2, ui.onbStep+1); renderOnboarding(true); break;
    case 'onbPrev': ui.onbStep = Math.max(0, ui.onbStep-1); renderOnboarding(true); break;
    case 'onbSkip': finishOnboarding('skip'); break;
    case 'onbFinish': finishOnboarding('generate'); break;
    case 'onbUpload': finishOnboarding('upload'); break;
    default: break;
  }
});

document.addEventListener('change', function(e){
  const bf = e.target.dataset ? e.target.dataset.bf : '';
  if(bf && ui.importBatch && e.target.dataset.id){
    const row = (ui.importBatch.rows || []).find(x=>x.id === e.target.dataset.id);
    if(row){
      if(bf==='checked'){ row.checked = Boolean(e.target.checked); updateImpSelection(); return; }
      if(bf==='category' || bf==='colorName'){ row[bf] = e.target.value; return; }
    }
  }
  if(e.target.hasAttribute('data-bg-strength')){
    ui.bg.strength = e.target.value;
    if(ui.bg.enabled) reprocessImportBg(); else render();
    return;
  }
  if(e.target.hasAttribute('data-draft-bg-strength')){
    ui.bg.strength = e.target.value;
    if(ui.draft) applyBgToDraft();
    return;
  }
  const refSelect = e.target.closest('[data-ref-style]');
  if(refSelect){
    setRefStyle(refSelect.dataset.id, refSelect.value);
    return;
  }
  if(e.target.id==='filterStyle'){
    ui.filterStyle = e.target.value;
    render();
    return;
  }
  if(e.target.id==='filterSeason'){
    ui.filterSeason = e.target.value;
    render();
  }
});

document.addEventListener('input', function(e){
  const target = e.target;
  if(target.id==='bulkText' && ui.bulk){
    ui.bulk.text = target.value;
    return;
  }
  if(target.dataset && target.dataset.bf && ui.importBatch && target.dataset.id){
    const field = target.dataset.bf;
    if(field==='name' || field==='price'){
      const row = (ui.importBatch.rows || []).find(x=>x.id === target.dataset.id);
      if(row) row[field] = target.value;
    }
    return;
  }
  if(target.classList && target.classList.contains('draft-input')){
    if(ui.draft && target.dataset.field) ui.draft[target.dataset.field] = target.value;
    return;
  }
  if(target.dataset && target.dataset.aiField){
    aiConfig[target.dataset.aiField] = target.value;
    ui.aiTestStatus = 'idle';
    ui.aiTestMessage = '';
    const box = $('#aiTestResult');
    if(box){ box.className='test-result'; box.textContent=''; }
    updateModePill();
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && ui.editingId) closeSheet();
});

async function boot(){
  const wardrobeInput = $('#wardrobeInput');
  if(wardrobeInput){
    wardrobeInput.addEventListener('change', function(){
      const files = Array.from(wardrobeInput.files || []);
      wardrobeInput.value = '';
      if(files.length) handleWardrobeFiles(files);
    });
  }
  const refInput = $('#refInput');
  if(refInput){
    refInput.addEventListener('change', function(){
      const files = Array.from(refInput.files || []);
      refInput.value = '';
      if(files.length) handleRefFiles(files);
    });
  }
  const shotInput = $('#shotInput');
  if(shotInput){
    shotInput.addEventListener('change', function(){
      const files = Array.from(shotInput.files || []);
      shotInput.value = '';
      if(files.length) handleShotFiles(files);
      else ui.shotCombine = false;
    });
  }
  try{ await ImgStore.init(); }catch(e){ ImgStore.mode = 'local'; }
  try{
    if(ImgStore.mode === 'idb'){
      await migrateLegacyToIdb();
      await hydrateAssets();
    }else{
      const n = await localizeExisting();
      if(n) persist();
    }
  }catch(e){}
  activeTab(ui.tab);
  render();
  renderOnboarding();
  updateModePill();
  refreshStorageInfo();
  if(ImgStore.mode === 'local' && !ui.localNoticeShown){
    ui.localNoticeShown = true;
    setTimeout(()=>toast('file:// 下 IndexedDB 不可用，已启用受限压缩存储；用本地服务打开可获得完整容量'), 1400);
  }
  window.__bootDoneAt = performance.now();
}
document.addEventListener('DOMContentLoaded', boot);
</script>
<div class="pwa-install" id="pwaInstall" hidden>
  <div class="pwa-txt">
    <strong>安装「衣橱灵感」到桌面</strong>
    <span id="pwaHint">像 App 一样打开，首次联网后可离线使用</span>
  </div>
  <button class="btn btn-accent" id="pwaInstallBtn" hidden>安装</button>
  <button class="pwa-close" id="pwaClose" aria-label="关闭">×</button>
</div>
<script>
(function(){
  try{
    var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    var box = document.getElementById('pwaInstall');
    var hint = document.getElementById('pwaHint');
    var btn = document.getElementById('pwaInstallBtn');
    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var dismissed = false;
    try { dismissed = localStorage.getItem('ootd_pwa_dismissed') === '1'; } catch(e){}
    if(!box) return;
    document.getElementById('pwaClose').addEventListener('click', function(){
      box.hidden = true;
      try { localStorage.setItem('ootd_pwa_dismissed','1'); } catch(e){}
    });
    if(isStandalone || dismissed) return;
    var deferred = null;
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferred = e;
      btn.hidden = false;
      hint.textContent = '像 App 一样打开，桌面图标直达，离线也能用';
      box.hidden = false;
    });
    btn.addEventListener('click', function(){
      if(!deferred) return;
      deferred.prompt();
      deferred.userChoice && deferred.userChoice.then(function(){ deferred = null; box.hidden = true; });
    });
    if(isIOS){
      hint.textContent = 'Safari → 分享 → 添加到主屏幕';
      box.hidden = false;
      return;
    }
    setTimeout(function(){
      if(box.hidden){ hint.textContent = '浏览器菜单 → 添加到主屏幕 / 安装应用'; box.hidden = false; }
    }, 6000);
  }catch(e){}
})();
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function(){});
  });
}
</script>
</body>
</html>
